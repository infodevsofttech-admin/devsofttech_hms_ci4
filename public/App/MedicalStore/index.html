    const [isLoadingLedger, setIsLoadingLedger] = useState(false);
    const [showPaymentModal, setShowPaymentModal] = useState(false);
    const [isRecordingPayment, setIsRecordingPayment] = useState(false);
    const [paymentForm, setPaymentForm] = useState({
        supplier_id: '',
        purchase_id: '',
        amount: '',
        payment_mode: 'Bank',
        reference_no: '',
        bank_name: '',
        payment_date: new Date().toISOString().split('T')[0],
        remarks: ''
    });

    // --- Short Items / Deficiency Reorder States ---
    const [shortItems, setShortItems] = useState([]);
    const [selectedShortItemIds, setSelectedShortItemIds] = useState([]);
    const [shortFilter, setShortFilter] = useState('all'); // all, out_of_stock, low_stock
    const [shortSearch, setShortSearch] = useState('');
    const [isLoadingShortItems, setIsLoadingShortItems] = useState(false);
    const [showQuickReorderModal, setShowQuickReorderModal] = useState(false);
    const [quickReorderForm, setQuickReorderForm] = useState({ item_id: '', item_name: '', min_reorder_level: 10 });
    const [isSavingShortItem, setIsSavingShortItem] = useState(false);

    // --- Purchase Orders States ---
    const [purchaseOrders, setPurchaseOrders] = useState([]);
    const [poStatusFilter, setPoStatusFilter] = useState('all');
    const [isLoadingPOs, setIsLoadingPOs] = useState(false);
    const [showPoCreateModal, setShowPoCreateModal] = useState(false);
    const [poCreateForm, setPoCreateForm] = useState({
        supplier_id: '',
        expected_delivery_date: new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
        remarks: '',
        items: []
    });
    const [isSavingPO, setIsSavingPO] = useState(false);
    const [showPoViewModal, setShowPoViewModal] = useState(false);
    const [activeViewPo, setActiveViewPo] = useState(null);
    const [loadedPoId, setLoadedPoId] = useState(null);
    const [loadedPoNumber, setLoadedPoNumber] = useState('');

    // --- Data Fetching & Action Handlers ---
    const fetchLedgerSummary = async () => {
        setIsLoadingLedger(true);
        try {
            const res = await fetch(API_BASE + 'suppliers/ledger-summary');
            const data = await res.json();
            if (data.status) {
                setLedgerSummary(data.suppliers || []);
                if (data.summary) setLedgerOverall(data.summary);
            }
        } catch (e) {
            console.error('fetchLedgerSummary error:', e);
        } finally {
            setIsLoadingLedger(false);
        }
    };

    const fetchSupplierLedger = async (supplierId) => {
        if (!supplierId) {
            setActiveLedgerDetail(null);
            return;
        }
        setIsLoadingLedger(true);
        try {
            const res = await fetch(API_BASE + 'suppliers/ledger/' + supplierId);
            const data = await res.json();
            if (data.status) {
                setActiveLedgerDetail(data);
            } else {
                notify(data.message || 'Failed to fetch supplier ledger.', 'error');
            }
        } catch (e) {
            notify('Error fetching ledger: ' + e.message, 'error');
        } finally {
            setIsLoadingLedger(false);
        }
    };

    const openPaymentModal = (supplierId, purchaseId = 0, defaultAmount = 0) => {
        const sId = supplierId ? String(supplierId) : (activeLedgerSupplierId || '');
        setPaymentForm({
            supplier_id: sId,
            purchase_id: purchaseId ? String(purchaseId) : '',
            amount: defaultAmount > 0 ? defaultAmount : '',
            payment_mode: 'Bank',
            reference_no: '',
            bank_name: '',
            payment_date: new Date().toISOString().split('T')[0],
            remarks: purchaseId ? ('Payment for invoice #' + purchaseId) : 'On-account settlement'
        });
        setShowPaymentModal(true);
    };

    const handleRecordPayment = async (e) => {
        if (e) e.preventDefault();
        const supId = Number(paymentForm.supplier_id);
        const amt = parseFloat(paymentForm.amount);
        if (!supId || isNaN(amt) || amt <= 0) {
            notify('Please specify a supplier and valid payment amount.', 'error');
            return;
        }

        setIsRecordingPayment(true);
        try {
            const res = await fetch(API_BASE + 'suppliers/record-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    store_id: store.store_id,
                    supplier_id: supId,
                    purchase_id: Number(paymentForm.purchase_id) || 0,
                    amount: amt,
                    payment_mode: paymentForm.payment_mode,
                    reference_no: paymentForm.reference_no,
                    bank_name: paymentForm.bank_name,
                    payment_date: paymentForm.payment_date,
                    remarks: paymentForm.remarks
                })
            });
            const data = await res.json();
            if (data.status) {
                notify('Payment recorded! Voucher #' + data.voucher_no, 'success');
                setShowPaymentModal(false);
                fetchLedgerSummary();
                if (activeLedgerSupplierId && String(activeLedgerSupplierId) === String(supId)) {
                    fetchSupplierLedger(supId);
                }
            } else {
                notify(data.message || 'Failed to record payment.', 'error');
            }
        } catch (err) {
            notify('Payment error: ' + err.message, 'error');
        } finally {
            setIsRecordingPayment(false);
        }
    };

    const fetchShortItems = async () => {
        setIsLoadingShortItems(true);
        try {
            const res = await fetch(API_BASE + 'stock/short-items?store_id=' + store.store_id);
            const data = await res.json();
            if (data.status) {
                setShortItems(data.short_items || []);
            }
        } catch (e) {
            console.error('fetchShortItems error:', e);
        } finally {
            setIsLoadingShortItems(false);
        }
    };

    const handleSaveShortItemFlag = async (e) => {
        if (e) e.preventDefault();
        if (!quickReorderForm.item_id) {
            notify('Please select an item to track in Short Book.', 'error');
            return;
        }
        setIsSavingShortItem(true);
        try {
            const res = await fetch(API_BASE + 'stock/flag-short-item', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    item_id: Number(quickReorderForm.item_id),
                    min_reorder_level: Number(quickReorderForm.min_reorder_level) || 10
                })
            });
            const data = await res.json();
            if (data.status) {
                notify(data.message || 'Item updated in Short Book!', 'success');
                setShowQuickReorderModal(false);
                fetchShortItems();
            } else {
                notify(data.message || 'Failed to update reorder level.', 'error');
            }
        } catch (err) {
            notify('Error: ' + err.message, 'error');
        } finally {
            setIsSavingShortItem(false);
        }
    };

    const fetchPurchaseOrders = async () => {
        setIsLoadingPOs(true);
        try {
            const res = await fetch(API_BASE + 'purchase-orders?store_id=' + store.store_id + '&status=' + poStatusFilter);
            const data = await res.json();
            if (data.status) {
                setPurchaseOrders(data.purchase_orders || []);
            }
        } catch (e) {
            console.error('fetchPurchaseOrders error:', e);
        } finally {
            setIsLoadingPOs(false);
        }
    };

    const openCreatePoFromShortItems = () => {
        const selected = shortItems.filter(it => selectedShortItemIds.includes(it.item_id));
        if (selected.length === 0) {
            notify('Please select at least one item from the short list.', 'warning');
            return;
        }

        const defaultSupplier = selected.find(s => s.last_supplier_id > 0)?.last_supplier_id || (suppliers[0]?.supplier_id || '');

        setPoCreateForm({
            supplier_id: defaultSupplier ? String(defaultSupplier) : '',
            expected_delivery_date: new Date(Date.now() + 3 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
            remarks: 'Replenishment purchase order from hospital deficiency book',
            items: selected.map(it => ({
                item_id: it.item_id,
                item_name: it.item_name,
                generic_name: it.generic_name || '',
                category: it.category || 'Tablet',
                order_packs: it.suggested_packs || 1,
                units_per_pack: it.units_per_pack || 10,
                estimated_ptr: it.last_ptr || 0,
                gst_rate: it.gst_rate || 12
            }))
        });
        setShowPoCreateModal(true);
    };

    const handleSavePurchaseOrder = async (e) => {
        if (e) e.preventDefault();
        const supId = Number(poCreateForm.supplier_id);
        if (!supId || poCreateForm.items.length === 0) {
            notify('Supplier and at least one line item are required for PO.', 'error');
            return;
        }

        setIsSavingPO(true);
        try {
            const res = await fetch(API_BASE + 'purchase-orders/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    store_id: store.store_id,
                    supplier_id: supId,
                    expected_delivery_date: poCreateForm.expected_delivery_date,
                    remarks: poCreateForm.remarks,
                    items: poCreateForm.items
                })
            });
            const data = await res.json();
            if (data.status) {
                notify('Purchase Order ' + data.po_number + ' created successfully!', 'success');
                setShowPoCreateModal(false);
                setSelectedShortItemIds([]);
                fetchPurchaseOrders();
                setSubTab('purchase_orders');
            } else {
                notify(data.message || 'Failed to create PO.', 'error');
            }
        } catch (err) {
            notify('PO error: ' + err.message, 'error');
        } finally {
            setIsSavingPO(false);
        }
    };

    const handleViewPo = async (poId) => {
        try {
            const res = await fetch(API_BASE + 'purchase-orders/' + poId);
            const data = await res.json();
            if (data.status) {
                setActiveViewPo(data);
                setShowPoViewModal(true);
            } else {
                notify(data.message || 'PO not found', 'error');
            }
        } catch (err) {
            notify('Error loading PO: ' + err.message, 'error');
        }
    };

    const handleCancelPo = async (poId) => {
        if (!confirm('Are you sure you want to cancel this Purchase Order?')) return;
        try {
            const res = await fetch(API_BASE + 'purchase-orders/cancel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ po_id: poId })
            });
            const data = await res.json();
            if (data.status) {
                notify(data.message || 'PO cancelled', 'success');
                fetchPurchaseOrders();
            } else {
                notify(data.message || 'Failed to cancel PO', 'error');
            }
        } catch (err) {
            notify('Error: ' + err.message, 'error');
        }
    };

    const loadPoIntoInwardBill = async (poId) => {
        try {
            const res = await fetch(API_BASE + 'purchase-orders/' + poId);
            const data = await res.json();
            if (data.status && data.purchase_order) {
                const po = data.purchase_order;
                const poItems = data.items || [];
                setSelectedSupplierId(String(po.supplier_id));
                setLoadedPoId(po.po_id);
                setLoadedPoNumber(po.po_number);
                setInvoiceNo('INV-' + po.po_number);

                if (poItems.length > 0) {
                    setRows(poItems.map(it => ({
                        item_id: it.item_id || 0,
                        item_name: it.item_name,
                        generic_name: it.generic_name || '',
                        category: it.category || 'Tablet',
                        batch_no: '',
                        expiry_date: '',
                        qty_packs: it.order_packs || 1,
                        free_qty_packs: 0,
                        units_per_pack: it.units_per_pack || 10,
                        mrp: it.estimated_ptr ? Math.round(Number(it.estimated_ptr) * 1.35) : 0,
                        ptr: Number(it.estimated_ptr) || 0,
                        discount_pct: 0,
                        gst_rate: Number(it.gst_rate) || 12,
                        hsn_code: '3004'
                    })));
                }

                setSubTab('inward');
                setShowPoViewModal(false);
                notify('Loaded ' + poItems.length + ' items from ' + po.po_number + '. Verify batch & expiry to record inward bill.', 'info');
            } else {
                notify('Could not load PO details.', 'error');
            }
        } catch (err) {
            notify('Error loading PO: ' + err.message, 'error');
        }
    };

    useEffect(() => {
        fetchSuppliers();
        fetchMasterSupportData();
    }, []);

    const fetchMasterSupportData = async () => {
        try {
            const res = await fetch(API_BASE + 'items/master-support-data');
            const data = await res.json();
            if (data.status) {
                setSupportData(data);
            }
        } catch (e) {
            console.error('Error fetching master support data:', e);
        }
    };

    const fetchSuppliers = async () => {
        try {
            const res = await fetch(API_BASE + 'suppliers');
            const data = await res.json();
            if (data.status) setSuppliers(data.suppliers || []);
        } catch (e) {
            console.error(e);
        }
    };

    const openAddSupplier = () => {
        setSupplierForm({
            supplier_id: 0,
            supplier_name: '',
            contact_person: '',
            phone: '',
            email: '',
            gstin: '',
            pan_no: '',
            dl_no_20b: '',
            dl_no_21b: '',
            state_code: '07',
            credit_days: 30,
            address: '',
            bank_details: ''
        });
        setShowSupplierModal(true);
    };

    const openEditSupplier = (s) => {
        setSupplierForm({
            supplier_id: s.supplier_id,
            supplier_name: s.supplier_name || '',
            contact_person: s.contact_person || '',
            phone: s.phone || '',
            email: s.email || '',
            gstin: s.gstin || '',
            pan_no: s.pan_no || '',
            dl_no_20b: s.dl_no_20b || '',
            dl_no_21b: s.dl_no_21b || '',
            state_code: s.state_code || '07',
            credit_days: s.credit_days || 30,
            address: s.address || '',
            bank_details: s.bank_details || ''
        });
        setShowSupplierModal(true);
    };

    const handleSaveSupplier = async (e) => {
        if (e) e.preventDefault();
        if (!supplierForm.supplier_name.trim()) {
            notify('Supplier / Distributor name is required.', 'error');
            return;
        }

        setIsSavingSupplier(true);
        try {
            const res = await fetch(API_BASE + 'suppliers/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(supplierForm)
            });
            const data = await res.json();
            if (data.status) {
                notify(supplierForm.supplier_id ? 'Supplier updated successfully!' : 'New supplier added successfully!', 'success');
                setShowSupplierModal(false);
                await fetchSuppliers();
                if (data.supplier_id) {
                    setSelectedSupplierId(String(data.supplier_id));
                }
            } else {
                notify(data.message || 'Failed to save supplier.', 'error');
            }
        } catch (err) {
            notify('Network error saving supplier: ' + err.message, 'error');
        } finally {
            setIsSavingSupplier(false);
        }
    };

    const handleDeleteSupplier = async (supplierId, supplierName) => {
        if (!confirm(`Are you sure you want to remove / deactivate supplier "${supplierName}"?`)) return;
        try {
            const res = await fetch(API_BASE + 'suppliers/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ supplier_id: supplierId })
            });
            const data = await res.json();
            if (data.status) {
                notify(data.message || 'Supplier removed successfully.', 'success');
                await fetchSuppliers();
            } else {
                notify(data.message || 'Failed to remove supplier.', 'error');
            }
        } catch (err) {
            notify('Error: ' + err.message, 'error');
        }
    };

    const filteredSuppliers = suppliers.filter(s => {
        if (!supplierSearch.trim()) return true;
        const q = supplierSearch.toLowerCase();
        return (s.supplier_name && s.supplier_name.toLowerCase().includes(q)) ||
               (s.gstin && s.gstin.toLowerCase().includes(q)) ||
               (s.dl_no_20b && s.dl_no_20b.toLowerCase().includes(q)) ||
               (s.dl_no_21b && s.dl_no_21b.toLowerCase().includes(q)) ||
               (s.phone && s.phone.toLowerCase().includes(q)) ||
               (s.contact_person && s.contact_person.toLowerCase().includes(q));
    });

    const addRow = () => {
        setRows([...rows, { item_id: 0, item_name: '', generic_name: '', category: 'Tablet', batch_no: '', expiry_date: '', qty_packs: 1, free_qty_packs: 0, units_per_pack: 10, mrp: 0, ptr: 0, discount_pct: 0, gst_rate: 12, hsn_code: '3004' }]);
    };

    const updateRow = (idx, field, val) => {
        const updated = [...rows];
        updated[idx][field] = val;
        setRows(updated);
    };

    const removeRow = (idx) => {
        if (rows.length <= 1) {
            setRows([{ item_id: 0, item_name: '', generic_name: '', category: 'Tablet', batch_no: '', expiry_date: '', qty_packs: 1, free_qty_packs: 0, units_per_pack: 10, mrp: 0, ptr: 0, discount_pct: 0, gst_rate: 12, hsn_code: '3004' }]);
            return;
        }
        setRows(rows.filter((_, i) => i !== idx));
    };

    // Autocomplete searching for Medicine Name
    const handleMedicineInputChange = (rowIndex, value) => {
        updateRow(rowIndex, 'item_name', value);
        setActiveSearchRow(rowIndex);

        if (searchTimerRef.current) clearTimeout(searchTimerRef.current);

        if (!value.trim() || value.trim().length < 1) {
            setSuggestions([]);
            return;
        }

        searchTimerRef.current = setTimeout(async () => {
            setIsSearchingMeds(true);
            try {
                const res = await fetch(API_BASE + 'items/search-master?q=' + encodeURIComponent(value.trim()));
                const data = await res.json();
                if (data.status) {
                    setSuggestions(data.items || []);
                }
            } catch (err) {
                console.error('Master search error:', err);
            } finally {
                setIsSearchingMeds(false);
            }
        }, 200);
    };

    const handleSelectMedicine = (rowIndex, item) => {
        const updated = [...rows];
        updated[rowIndex] = {
            ...updated[rowIndex],
            item_id: item.item_id || 0,
            item_name: item.item_name,
            generic_name: item.generic_name || '',
            category: item.category || 'Tablet',
            units_per_pack: Number(item.units_per_pack) > 0 ? Number(item.units_per_pack) : 10,
            gst_rate: item.gst_rate !== undefined ? Number(item.gst_rate) : 12,
            hsn_code: item.hsn_code || '3004'
        };
        setRows(updated);
        setActiveSearchRow(null);
        setSuggestions([]);

        // Focus Batch No field for this row
        setTimeout(() => {
            const batchInput = document.getElementById(`batch-input-${rowIndex}`);
            if (batchInput) {
                batchInput.focus();
                batchInput.select();
            }
        }, 50);
    };

    const openAddMasterModal = (rowIndex = null, initialName = '') => {
        const prefillName = initialName || (rowIndex !== null && rows[rowIndex] ? rows[rowIndex].item_name : '');
        setMasterTargetRow(rowIndex);
        setMasterForm({
            item_name: prefillName,
            generic_name: '',
            formulation: 'Tablet',
            units_per_pack: 10,
            packing: '10',
            hsn_code: '3004',
            gst_rate: 12,
            drug_schedule: 'Schedule H',
            company_name: '',
            min_reorder_level: 10
        });
        setActiveSearchRow(null);
        setSuggestions([]);
        setShowMasterModal(true);
    };

    const handleSaveMasterMedicine = async (e) => {
        if (e) e.preventDefault();
        if (!masterForm.item_name.trim()) {
            notify('Medicine name is required.', 'error');
            return;
        }

        setIsSavingMaster(true);
        try {
            const res = await fetch(API_BASE + 'items/save-master', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(masterForm)
            });
            const data = await res.json();
            if (data.status && data.item) {
                notify(`"${data.item.item_name}" saved to Pharmacy Master & selected!`, 'success');
                setShowMasterModal(false);

                // Auto-select into the target row or create a new row
                if (masterTargetRow !== null && masterTargetRow < rows.length) {
                    handleSelectMedicine(masterTargetRow, data.item);
                } else {
                    setRows([...rows, {
                        item_id: data.item.item_id || 0,
                        item_name: data.item.item_name,
                        generic_name: data.item.generic_name || '',
                        category: data.item.category || 'Tablet',
                        batch_no: '',
                        expiry_date: '',
                        qty_packs: 1,
                        free_qty_packs: 0,
                        units_per_pack: Number(data.item.units_per_pack) || 10,
                        mrp: 0,
                        ptr: 0,
                        discount_pct: 0,
                        gst_rate: Number(data.item.gst_rate) || 12,
                        hsn_code: data.item.hsn_code || '3004'
                    }]);
                }
            } else {
                notify(data.message || 'Failed to save medicine to master.', 'error');
            }
        } catch (err) {
            notify('Error saving to master: ' + err.message, 'error');
        } finally {
            setIsSavingMaster(false);
        }
    };

    const savePurchaseBill = async () => {
        if (!selectedSupplierId || !invoiceNo) {
            notify('Please select supplier and enter invoice number.', 'error');
            return;
        }

        const validItems = rows.filter(r => r.item_name && r.batch_no && r.expiry_date && Number(r.qty_packs) > 0);
        if (validItems.length === 0) {
            notify('Please fill at least one valid item line.', 'error');
            return;
        }

        try {
            const itemsPayload = validItems.map(r => ({
                item_id: Number(r.item_id || 0),
                item_name: r.item_name,
                generic_name: r.generic_name || '',
                category: r.category || 'Tablet',
                batch_no: r.batch_no,
                expiry_date: r.expiry_date,
                qty_packs: Number(r.qty_packs),
                free_qty_packs: Number(r.free_qty_packs || 0),
                units_per_pack: Number(r.units_per_pack || 10),
                mrp: Number(r.mrp),
                ptr: Number(r.ptr),
                discount_pct: Number(r.discount_pct || 0),
                gst_rate: Number(r.gst_rate || 12),
                hsn_code: r.hsn_code || '3004'
            }));

            const res = await fetch(API_BASE + 'purchase/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    store_id: store.store_id,
                    supplier_id: Number(selectedSupplierId),
                    supplier_invoice_no: invoiceNo,
                    invoice_date: invoiceDate,
                    po_id: loadedPoId || undefined,
                    items: itemsPayload
                })
            });
            const data = await res.json();
            if (data.status) {
                notify('Purchase inward recorded! Stock & Supplier Ledger updated.' + (loadedPoNumber ? (' (PO ' + loadedPoNumber + ' marked as received)') : ''), 'success');
                setInvoiceNo('');
                setLoadedPoId(null);
                setLoadedPoNumber('');
                setRows([{ item_id: 0, item_name: '', generic_name: '', category: 'Tablet', batch_no: '', expiry_date: '', qty_packs: 1, free_qty_packs: 0, units_per_pack: 10, mrp: 0, ptr: 0, discount_pct: 0, gst_rate: 12, hsn_code: '3004' }]);
            } else {
                notify(data.message || 'Failed to save purchase bill.', 'error');
            }
        } catch (e) {
            notify('Purchase bill error: ' + e.message, 'error');
        }
    };

    return (
        <div>
            <div className="d-flex flex-wrap gap-2 mb-3 align-items-center">
                <button className={`btn btn-sm ${subTab === 'inward' ? 'btn-primary shadow-sm' : 'btn-outline-secondary'}`} onClick={() => setSubTab('inward')}>
                    <i className="bi bi-box-arrow-in-down me-1"></i> Inward Purchase Bill
                </button>
                <button className={`btn btn-sm ${subTab === 'ledger' ? 'btn-primary shadow-sm' : 'btn-outline-secondary'}`} onClick={() => { setSubTab('ledger'); fetchLedgerSummary(); }}>
                    <i className="bi bi-journal-bookmark me-1"></i> Supplier Ledger &amp; Payments
                </button>
                <button className={`btn btn-sm ${subTab === 'short_items' ? 'btn-warning text-dark fw-bold shadow-sm' : 'btn-outline-secondary'}`} onClick={() => { setSubTab('short_items'); fetchShortItems(); }}>
                    <i className="bi bi-exclamation-triangle me-1"></i> Short Items &amp; PO Generator
                    {shortItems.length > 0 && <span className="badge bg-danger ms-1">{shortItems.length}</span>}
                </button>
                <button className={`btn btn-sm ${subTab === 'purchase_orders' ? 'btn-primary shadow-sm' : 'btn-outline-secondary'}`} onClick={() => { setSubTab('purchase_orders'); fetchPurchaseOrders(); }}>
                    <i className="bi bi-file-earmark-text me-1"></i> Purchase Orders
                </button>
                <button className={`btn btn-sm ${subTab === 'suppliers' ? 'btn-primary shadow-sm' : 'btn-outline-secondary'}`} onClick={() => setSubTab('suppliers')}>
                    <i className="bi bi-truck me-1"></i> Supplier Directory ({suppliers.length})
                </button>
                <button className={`btn btn-sm ${subTab === 'marg' ? 'btn-success shadow-sm' : 'btn-outline-secondary'}`} onClick={() => setSubTab('marg')}>
                    <i className="bi bi-file-earmark-spreadsheet me-1"></i> Marg ERP / Excel Import
                </button>
            </div>

            {subTab === 'inward' && (
                <div className="counter-card">
                    <div className="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                        <h5 className="fw-bold mb-0"><i className="bi bi-receipt text-primary me-1"></i> Distributor Purchase Inward (Stock Entry)</h5>
                        <div className="d-flex align-items-center gap-2">
                            {loadedPoNumber ? (
                                <div className="badge bg-info-subtle text-info border border-info px-2 py-1.5 d-flex align-items-center gap-1.5" style={{ fontSize: '12px' }}>
                                    <i className="bi bi-link-45deg fs-6"></i>
                                    <span>Linked PO: <strong>{loadedPoNumber}</strong></span>
                                    <button type="button" className="btn-close btn-close-dark ms-1" style={{ fontSize: '9px' }} onClick={() => { setLoadedPoId(null); setLoadedPoNumber(''); }} title="Unlink PO"></button>
                                </div>
                            ) : (
                                <button 
                                    type="button" 
                                    className="btn btn-sm btn-outline-primary"
                                    onClick={() => {
                                        fetchPurchaseOrders();
                                        setSubTab('purchase_orders');
                                    }}
                                >
                                    <i className="bi bi-box-arrow-in-down-right me-1"></i> Load from Purchase Order
                                </button>
                            )}
                        </div>
                    </div>
                    <div className="row g-2 mb-3">
                        <div className="col-md-4">
                            <div className="d-flex justify-content-between align-items-center mb-1">
                                <label className="form-label small fw-bold mb-0">Supplier / Distributor</label>
                                <button type="button" className="btn btn-link btn-sm p-0 text-decoration-none fw-semibold" style={{ fontSize: '11px' }} onClick={openAddSupplier}>
                                    <i className="bi bi-plus-circle me-1"></i>+ Add New
                                </button>
                            </div>
                            <select className="form-select form-select-sm" value={selectedSupplierId} onChange={(e) => setSelectedSupplierId(e.target.value)}>
                                <option value="">-- Select Supplier --</option>
                                {suppliers.map(s => (
                                    <option key={s.supplier_id} value={s.supplier_id}>
                                        {s.supplier_name} (GST: {s.gstin || 'N/A'})
                                    </option>
                                ))}
                            </select>
                        </div>
                        <div className="col-md-4">
                            <label className="form-label small fw-bold">Supplier Bill / Invoice No.</label>
                            <input type="text" className="form-control form-control-sm" placeholder="e.g. APX-9941" value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} />
                        </div>
                        <div className="col-md-4">
                            <label className="form-label small fw-bold">Invoice Date</label>
                            <input type="date" className="form-control form-control-sm" value={invoiceDate} onChange={(e) => setInvoiceDate(e.target.value)} />
                        </div>
                    </div>

                    <div className="table-responsive" style={{ overflow: 'visible' }}>
                        <table className="table table-pos table-bordered">
                            <thead>
                                <tr>
                                    <th style={{ minWidth: 280 }}>
                                        <div className="d-flex justify-content-between align-items-center">
                                            <span>Medicine Name (Master Auto-Search)</span>
                                            <button 
                                                type="button" 
                                                className="btn btn-link btn-sm p-0 text-decoration-none fw-semibold" 
                                                style={{ fontSize: '11px' }} 
                                                onClick={() => openAddMasterModal(rows.length - 1, '')}
                                            >
                                                <i className="bi bi-plus-circle me-1"></i>+ Add to Master
                                            </button>
                                        </div>
                                    </th>
                                    <th style={{ width: 130 }}>Batch No</th>
                                    <th style={{ width: 140 }}>Expiry</th>
                                    <th style={{ width: 75 }}>Packs</th>
                                    <th style={{ width: 65 }}>Free</th>
                                    <th style={{ width: 85 }}>Units/Pack</th>
                                    <th style={{ width: 85 }}>PTR (₹)</th>
                                    <th style={{ width: 85 }}>MRP (₹)</th>
                                    <th style={{ width: 75 }}>GST%</th>
                                    <th style={{ width: 40 }}></th>
                                </tr>
                            </thead>
                            <tbody>
                                {rows.map((r, i) => (
                                    <tr key={i}>
                                        <td style={{ position: 'relative' }}>
                                            <div className="input-group input-group-sm">
                                                <input 
                                                    type="text" 
                                                    id={`med-search-input-${i}`}
                                                    className={`form-control form-control-sm fw-semibold ${r.item_id ? 'border-success' : ''}`} 
                                                    placeholder="Type medicine name (e.g. Augmentin)..." 
                                                    value={r.item_name} 
                                                    autoComplete="off"
                                                    onChange={(e) => handleMedicineInputChange(i, e.target.value)} 
                                                    onFocus={(e) => {
                                                        setActiveSearchRow(i);
                                                        if (e.target.value.trim().length >= 1) {
                                                            handleMedicineInputChange(i, e.target.value);
                                                        }
                                                    }}
                                                />
                                                {r.item_id > 0 && (
                                                    <span className="input-group-text bg-success text-white py-0 px-1.5" title="Item matched in Master Catalog">
                                                        <i className="bi bi-check2"></i>
                                                    </span>
                                                )}
                                            </div>

                                            {/* Subtext with Generic and Category */}
                                            {r.generic_name ? (
                                                <div className="text-muted text-truncate mt-1 d-flex align-items-center gap-1" style={{ fontSize: '11px', maxWidth: '270px' }}>
                                                    <span className="badge bg-light text-primary border" style={{ fontSize: '9.5px' }}>{r.category || 'Tablet'}</span>
                                                    <span>{r.generic_name}</span>
                                                </div>
                                            ) : null}

                                            {/* Autocomplete Dropdown */}
                                            {activeSearchRow === i && (
                                                <div 
                                                    className="shadow-lg border rounded-2 bg-white"
                                                    style={{
                                                        position: 'absolute',
                                                        top: '100%',
                                                        left: 0,
                                                        width: '380px',
                                                        maxHeight: '280px',
                                                        overflowY: 'auto',
                                                        zIndex: 1060,
                                                        marginTop: '2px'
                                                    }}
                                                >
                                                    {/* Dropdown Header */}
                                                    <div className="bg-light px-2.5 py-1.5 border-bottom d-flex justify-content-between align-items-center">
                                                        <span className="small fw-bold text-secondary" style={{ fontSize: '11px' }}>
                                                            {isSearchingMeds ? (
                                                                <span><i className="bi bi-hourglass-split spinner-border spinner-border-sm me-1"></i>Searching master...</span>
                                                            ) : (
                                                                <span><i className="bi bi-database-check me-1 text-primary"></i>Pharmacy Master ({suggestions.length} found)</span>
                                                            )}
                                                        </span>
                                                        <button 
                                                            type="button" 
                                                            className="btn-close" 
                                                            style={{ fontSize: '9px' }}
                                                            onClick={() => setActiveSearchRow(null)}
                                                        ></button>
                                                    </div>

                                                    {/* Suggestions List */}
                                                    {suggestions.length > 0 ? (
                                                        suggestions.map((item, sIdx) => (
                                                            <div
                                                                key={sIdx}
                                                                className="p-2 border-bottom hover-bg-light"
                                                                style={{ cursor: 'pointer', transition: 'background-color 0.15s' }}
                                                                onMouseDown={(e) => {
                                                                    e.preventDefault();
                                                                    handleSelectMedicine(i, item);
                                                                }}
                                                            >
                                                                <div className="d-flex justify-content-between align-items-center">
                                                                    <span className="fw-bold text-dark" style={{ fontSize: '12.5px' }}>{item.item_name}</span>
                                                                    <span className="badge bg-primary-subtle text-primary border" style={{ fontSize: '10px' }}>
                                                                        {item.category || 'Tablet'}
                                                                    </span>
                                                                </div>
                                                                {item.generic_name && (
                                                                    <div className="text-muted text-truncate small" style={{ fontSize: '11px' }}>
                                                                        {item.generic_name}
                                                                    </div>
                                                                )}
                                                                <div className="d-flex gap-2 mt-1 align-items-center" style={{ fontSize: '10.5px' }}>
                                                                    <span className="text-secondary">Pack: <strong>{item.units_per_pack || 10}s</strong></span>
                                                                    <span className="text-secondary">GST: <strong>{item.gst_rate}%</strong></span>
                                                                    <span className="text-secondary">HSN: <strong>{item.hsn_code || '3004'}</strong></span>
                                                                    {item.drug_schedule && item.drug_schedule !== 'OTC' && (
                                                                        <span className="badge bg-danger-subtle text-danger" style={{ fontSize: '9px' }}>{item.drug_schedule}</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        !isSearchingMeds && (
                                                            <div className="p-3 text-center text-muted">
                                                                <i className="bi bi-search fs-4 d-block mb-1 text-secondary"></i>
                                                                <div className="small fw-semibold">No medicine found matching "{r.item_name}"</div>
                                                                <div className="text-muted" style={{ fontSize: '11px' }}>Click below to add it directly into Pharmacy Master</div>
                                                            </div>
                                                        )
                                                    )}

                                                    {/* Pinned Add to Master Option */}
                                                    <div className="p-2 bg-light border-top text-center">
                                                        <button 
                                                            type="button" 
                                                            className="btn btn-sm btn-outline-primary w-100 fw-bold py-1"
                                                            style={{ fontSize: '12px' }}
                                                            onMouseDown={(e) => {
                                                                e.preventDefault();
                                                                openAddMasterModal(i, r.item_name);
                                                            }}
                                                        >
                                                            <i className="bi bi-plus-circle-fill me-1"></i>+ Add "{r.item_name || 'New Medicine'}" in Master
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </td>
                                        <td>

// 4. INTER-STORE INDENTS & TRANSFERS
// =========================================================================
function TransferView({ store, stores, notify }) {
    if (!store) return null;
    const [toStoreId, setToStoreId] = useState('');
    const [remarks, setRemarks] = useState('');
    const [transferItems, setTransferItems] = useState([
        { item_name: '', qty: 10 }
    ]);

    const addTransferRow = () => {
        setTransferItems([...transferItems, { item_name: '', qty: 10 }]);
    };

    const submitIndent = async () => {
        if (!toStoreId) {
            notify('Please select destination store counter.', 'error');
            return;
        }

        try {
            const res = await fetch(API_BASE + 'transfer/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    from_store_id: store.store_id,
                    to_store_id: Number(toStoreId),
                    remarks: remarks,
                    items: transferItems.map(it => ({ item_id: 1, qty: Number(it.qty) }))
                })
            });
            const data = await res.json();
            if (data.status) {
                notify(`Store Indent ${data.transfer_no} submitted to Central Pharmacy!`, 'success');
                setRemarks('');
            } else {
                notify(data.message || 'Failed to submit indent.', 'error');
            }
        } catch (e) {
            notify('Indent error: ' + e.message, 'error');
        }
    };

    return (
        <div className="counter-card">
            <h5 className="fw-bold mb-3"><i className="bi bi-arrow-left-right text-primary me-1"></i> Multi-Building Store Requisition (Indent)</h5>
            <p className="text-muted small">
                Building counters can requisition medicines from the Main Hospital Central Store. Once dispatched and physically verified, stock transfers automatically.
            </p>

            <div className="row g-2 mb-3">
                <div className="col-md-6">
                    <label className="form-label small fw-bold">Source Store (From)</label>
                    <input type="text" className="form-control form-control-sm" value={store.store_name} disabled />
                </div>
                <div className="col-md-6">
                    <label className="form-label small fw-bold">Target Counter / Building (To)</label>
                    <select className="form-select form-select-sm" value={toStoreId} onChange={(e) => setToStoreId(e.target.value)}>
                        <option value="">-- Select Destination Store --</option>
                        {stores.filter(s => s.store_id !== store.store_id).map(s => (
                            <option key={s.store_id} value={s.store_id}>
                                {s.store_name} ({s.store_slug})
                            </option>
                        ))}
                    </select>
                </div>
            </div>

            <div className="mb-3">
                <label className="form-label small fw-bold">Requested Medicines</label>
                {transferItems.map((ti, i) => (
                    <div key={i} className="row g-2 mb-2">
                        <div className="col-8">
                            <input 
                                type="text" 
                                className="form-control form-control-sm" 
                                placeholder="Medicine Name" 
                                value={ti.item_name} 
                                onChange={(e) => {
                                    const updated = [...transferItems];
                                    updated[i].item_name = e.target.value;
                                    setTransferItems(updated);
                                }} 
                            />
                        </div>
                        <div className="col-4">
                            <input 
                                type="number" 
                                className="form-control form-control-sm" 
                                placeholder="Quantity Required" 
                                min="1" 
                                value={ti.qty} 
                                onChange={(e) => {
                                    const updated = [...transferItems];
                                    updated[i].qty = e.target.value;
                                    setTransferItems(updated);
                                }} 
                            />
                        </div>
                    </div>
                ))}
                <button className="btn btn-sm btn-outline-primary mt-1" onClick={addTransferRow}>
                    <i className="bi bi-plus-circle me-1"></i> Add Another Medicine
                </button>
            </div>

            <button className="btn btn-primary-custom" onClick={submitIndent}>
                <i className="bi bi-send me-1"></i> Submit Store Indent Requisition
            </button>
        </div>
    );
}

function LedgersView({ store, notify }) {
    if (!store) return null;
    const [accTab, setAccTab] = useState('daybook');
    const [daybookData, setDaybookData] = useState(null);
    const [bankAuditData, setBankAuditData] = useState(null);
    const [auditFilterStatus, setAuditFilterStatus] = useState('all'); // 'all', 'pending', 'reconciled'
    const [auditSearch, setAuditSearch] = useState('');
    const [reconcilingSale, setReconcilingSale] = useState(null);
    const [auditNotes, setAuditNotes] = useState('');
    const [auditorName, setAuditorName] = useState('Accountant');
    const [isSubmittingAudit, setIsSubmittingAudit] = useState(false);
    const [gstData, setGstData] = useState(null);
    const [h1Records, setH1Records] = useState([]);

    useEffect(() => {
        if (!store?.store_id) return;
        if (accTab === 'daybook') loadDaybook();
        if (accTab === 'bank_audit') loadBankAudit(auditFilterStatus, auditSearch);
        if (accTab === 'gst') loadGst();
        if (accTab === 'schedule_h1') loadScheduleH1();
    }, [accTab, store?.store_id, auditFilterStatus]);

    const loadDaybook = async () => {
        try {
            const res = await fetch(API_BASE + `accounting/daybook?store_id=${store.store_id}`);
            const data = await res.json();
            if (data.status) setDaybookData(data);
        } catch (e) {
            console.error(e);
        }
    };

    const loadBankAudit = async (status = auditFilterStatus, search = auditSearch) => {
        try {
            const params = new URLSearchParams({
                store_id: store.store_id,
                status: status,
                search: search
            });
            const res = await fetch(API_BASE + `accounting/bank-reconciliation?${params.toString()}`);
            const data = await res.json();
            if (data.status) setBankAuditData(data);
        } catch (e) {
            console.error(e);
        }
    };

    const handleReconcileSubmit = async (saleId, isReconciled) => {
        setIsSubmittingAudit(true);
        try {
            const res = await fetch(API_BASE + 'accounting/reconcile-bank', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sale_id: saleId,
                    is_reconciled: isReconciled ? 1 : 0,
                    reconciled_notes: auditNotes,
                    reconciled_by: auditorName
                })
            });
            const data = await res.json();
            if (data.status) {
                notify(data.message, 'success');
                setReconcilingSale(null);
                setAuditNotes('');
                loadBankAudit(auditFilterStatus, auditSearch);
            } else {
                notify(data.message || 'Failed to update reconciliation', 'error');
            }
        } catch (e) {
            notify('Network error updating audit status: ' + e.message, 'error');
        } finally {
            setIsSubmittingAudit(false);
        }
    };

    const loadGst = async () => {
        try {
            const res = await fetch(API_BASE + `accounting/gst-report?store_id=${store.store_id}`);
            const data = await res.json();
            if (data.status) setGstData(data);
        } catch (e) {
            console.error(e);
        }
    };

    const loadScheduleH1 = async () => {
        try {
            const res = await fetch(API_BASE + `compliance/schedule-h1-register?store_id=${store.store_id}`);
            const data = await res.json();
            if (data.status) setH1Records(data.records || []);
        } catch (e) {
            console.error(e);
        }
    };

    return (
        <div>
            <div className="d-flex flex-wrap gap-2 mb-3">
                <button className={`btn btn-sm ${accTab === 'daybook' ? 'btn-primary' : 'btn-outline-secondary'}`} onClick={() => setAccTab('daybook')}>
                    <i className="bi bi-journal-check me-1"></i> Daily Cash Book / Day Book
                </button>
                <button className={`btn btn-sm ${accTab === 'bank_audit' ? 'btn-primary' : 'btn-outline-secondary'}`} onClick={() => setAccTab('bank_audit')}>
                    <i className="bi bi-bank2 me-1"></i> Bank &amp; UPI Statement Audit
                </button>
                <button className={`btn btn-sm ${accTab === 'gst' ? 'btn-primary' : 'btn-outline-secondary'}`} onClick={() => setAccTab('gst')}>
                    <i className="bi bi-file-earmark-spreadsheet me-1"></i> GST Returns (GSTR-1 &amp; 2)
                </button>
                <button className={`btn btn-sm ${accTab === 'schedule_h1' ? 'btn-primary' : 'btn-outline-secondary'}`} onClick={() => setAccTab('schedule_h1')}>
                    <i className="bi bi-shield-check me-1"></i> Statutory Schedule H1 Register
                </button>
            </div>

            {accTab === 'daybook' && daybookData && (

                    <div className="row g-3 mb-3">
                        <div className="col-md-3 col-sm-6">
                            <div className="counter-card p-3 border-start border-4 border-success">
