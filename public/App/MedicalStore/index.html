                                <div className="btn-group btn-group-sm">
                                    <button 
                                        className={`btn ${auditFilterStatus === 'all' ? 'btn-primary' : 'btn-outline-secondary'}`}
                                        onClick={() => setAuditFilterStatus('all')}
                                    >
                                        All ({bankAuditData?.summary?.total_count || 0})
                                    </button>
                                    <button 
                                        className={`btn ${auditFilterStatus === 'pending' ? 'btn-warning text-dark fw-bold' : 'btn-outline-secondary'}`}
                                        onClick={() => setAuditFilterStatus('pending')}
                                    >
                                        <i className="bi bi-hourglass-split me-1"></i> Pending Audit ({bankAuditData?.summary?.pending_count || 0})
                                    </button>
                                    <button 
                                        className={`btn ${auditFilterStatus === 'reconciled' ? 'btn-success' : 'btn-outline-secondary'}`}
                                        onClick={() => setAuditFilterStatus('reconciled')}
                                    >
                                        <i className="bi bi-check-circle me-1"></i> Reconciled ({bankAuditData?.summary?.reconciled_count || 0})
                                    </button>
                                </div>
                            </div>
                            <div className="col-md-6">
                                <div className="input-group input-group-sm">
                                    <input 
                                        type="text" 
                                        className="form-control" 
                                        placeholder="Search UTR No, Bill No, Patient Name, Bank..."
                                        value={auditSearch}
                                        onChange={(e) => setAuditSearch(e.target.value)}
                                        onKeyDown={(e) => { if (e.key === 'Enter') loadBankAudit(auditFilterStatus, auditSearch); }}
                                    />
                                    <button className="btn btn-outline-secondary" onClick={() => loadBankAudit(auditFilterStatus, auditSearch)}>
                                        <i className="bi bi-search"></i>
                                    </button>
                                    <button className="btn btn-outline-secondary" onClick={() => { setAuditSearch(''); loadBankAudit(auditFilterStatus, ''); }} title="Reset">
                                        <i className="bi bi-x-lg"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Bank Reconciliation Table */}
                    <div className="counter-card p-0 overflow-hidden mb-3">
                        <div className="p-3 border-bottom d-flex justify-content-between align-items-center">
                            <h6 className="mb-0 fw-bold"><i className="bi bi-journal-text text-primary me-1"></i> Bank &amp; UPI Transaction Audit Register</h6>
                            <button className="btn btn-xs btn-outline-primary" onClick={() => loadBankAudit(auditFilterStatus, auditSearch)}>
                                <i className="bi bi-arrow-clockwise me-1"></i> Refresh
                            </button>
                        </div>
                        <div className="table-responsive">
                            <table className="table table-pos mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th>Date &amp; Time</th>
                                        <th>Bill No</th>
                                        <th>Patient (UHID)</th>
                                        <th>Settlement Mode</th>
                                        <th>Payment Breakdown</th>
                                        <th>Bank / UPI Reference (UTR)</th>
                                        <th className="text-end">Bank/UPI (₹)</th>
                                        <th className="text-center">Audit Status</th>
                                        <th className="text-end">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {(!bankAuditData?.records || bankAuditData.records.length === 0) ? (
                                        <tr>
                                            <td colSpan="9" className="text-center py-4 text-muted">
                                                No UPI / Bank transactions match this filter.
                                            </td>
                                        </tr>
                                    ) : (
                                        bankAuditData.records.map((r) => {
                                            const bankAmount = (Number(r.upi_paid) || 0) + (Number(r.card_paid) || 0);
                                            const utrText = r.upi_ref_no || r.card_ref_no || r.payment_reference || 'N/A';
                                            return (
                                                <tr key={r.sale_id}>
                                                    <td style={{ fontSize: '12px' }}>{r.sale_date}</td>
                                                    <td className="fw-bold">{r.invoice_no}</td>
                                                    <td>
                                                        <div>{r.patient_name}</div>
                                                        {r.uhid && <small className="text-muted">{r.uhid}</small>}
                                                    </td>
                                                    <td>
                                                        <span className={`badge ${r.payment_mode === 'Mixed' ? 'bg-warning text-dark' : r.payment_mode === 'UPI' ? 'bg-info text-dark' : 'bg-secondary'}`}>
                                                            {r.payment_mode}
                                                        </span>
                                                    </td>
                                                    <td style={{ fontSize: '11px' }}>
                                                        {Number(r.cash_paid) > 0 && <span className="d-block text-muted">Cash: ₹{r.cash_paid}</span>}
                                                        {Number(r.upi_paid) > 0 && <span className="d-block text-primary fw-bold">UPI: ₹{r.upi_paid}</span>}
                                                        {Number(r.card_paid) > 0 && <span className="d-block text-dark">Card: ₹{r.card_paid}</span>}
                                                    </td>
                                                    <td>
                                                        <div>
                                                            <code className="text-primary fw-bold fs-7">{utrText}</code>
                                                            {utrText !== 'N/A' && (
                                                                <button 
                                                                    className="btn btn-xs btn-link text-decoration-none p-0 ms-1 text-muted"
                                                                    title="Copy UTR"
                                                                    onClick={() => {
                                                                        navigator.clipboard.writeText(utrText);
                                                                        notify('Copied UTR: ' + utrText, 'info');
                                                                    }}
                                                                >
                                                                    <i className="bi bi-clipboard"></i>
                                                                </button>
                                                            )}
                                                        </div>
                                                        {r.bank_name && <small className="text-muted d-block">{r.bank_name}</small>}
                                                    </td>
                                                    <td className="text-end fw-bolder text-primary fs-6">
                                                        ₹{bankAmount.toLocaleString('en-IN', { minimumFractionDigits: 2 })}
                                                    </td>
                                                    <td className="text-center">
                                                        {r.is_bank_reconciled == 1 ? (
                                                            <div>
                                                                <span className="badge bg-success"><i className="bi bi-check-circle-fill me-1"></i> Reconciled</span>
                                                                <div style={{ fontSize: '10px' }} className="text-muted mt-0.5">
                                                                    {r.reconciled_by || 'Accountant'} • {r.reconciled_at ? r.reconciled_at.split(' ')[0] : ''}
                                                                </div>
                                                                {r.reconciled_notes && (
                                                                    <div style={{ fontSize: '9px' }} className="text-secondary fst-italic">
                                                                        "{r.reconciled_notes}"
                                                                    </div>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <span className="badge bg-warning-subtle text-dark border border-warning">
                                                                <i className="bi bi-clock-history me-1"></i> Pending Audit
                                                            </span>
                                                        )}
                                                    </td>
                                                    <td className="text-end">
                                                        {r.is_bank_reconciled == 1 ? (
                                                            <button 
                                                                className="btn btn-xs btn-outline-danger"
                                                                onClick={() => handleReconcileSubmit(r.sale_id, 0)}
                                                                title="Undo Reconciliation Verification"
                                                                disabled={isSubmittingAudit}
                                                            >
                                                                <i className="bi bi-arrow-counterclockwise me-1"></i> Undo
                                                            </button>
                                                        ) : (
                                                            <button 
                                                                className="btn btn-sm btn-success fw-bold py-1 px-2"
                                                                onClick={() => {
                                                                    setReconcilingSale(r);
                                                                    setAuditNotes(`Matched ₹${bankAmount} in bank statement credit on ` + new Date().toISOString().split('T')[0]);
                                                                }}
                                                                title="Verify with bank statement"
                                                            >
                                                                <i className="bi bi-check2-circle me-1"></i> Verify Entry
                                                            </button>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Audit Verification Modal */}
                    {reconcilingSale && (
                        <div className="modal fade show d-block" style={{ backgroundColor: 'rgba(15, 23, 42, 0.75)' }} tabIndex="-1">
                            <div className="modal-dialog modal-dialog-centered">
                                <div className="modal-content border-0 shadow-lg">
                                    <div className="modal-header bg-primary text-white py-2.5 px-3">
                                        <div className="d-flex align-items-center gap-2">
                                            <i className="bi bi-bank2 fs-5"></i>
                                            <h6 className="modal-title mb-0 fw-bold">Audit &amp; Reconcile Bank Statement</h6>
                                        </div>
                                        <button type="button" className="btn-close btn-close-white" onClick={() => setReconcilingSale(null)}></button>
                                    </div>
                                    <div className="modal-body p-3">
                                        <div className="alert alert-primary py-2 mb-3" style={{ fontSize: '0.85rem' }}>
                                            <div className="d-flex justify-content-between">
                                                <span>Bill No: <strong>{reconcilingSale.invoice_no}</strong></span>
                                                <span>Date: <strong>{reconcilingSale.sale_date}</strong></span>
                                            </div>
                                            <div className="d-flex justify-content-between mt-1">
                                                <span>Patient: <strong>{reconcilingSale.patient_name}</strong></span>
                                                <span>Total Bill: <strong>₹{reconcilingSale.net_amount}</strong></span>
                                            </div>
                                        </div>

                                        <div className="p-2.5 rounded bg-light border mb-3">
                                            <label className="text-muted small fw-bold d-block mb-1">BANK STATEMENT MATCH CRITERIA</label>
                                            <div className="d-flex justify-content-between align-items-center mb-1">
                                                <span>Credit Amount in Bank:</span>
                                                <span className="fs-5 fw-bold text-success">
                                                    ₹{((Number(reconcilingSale.upi_paid) || 0) + (Number(reconcilingSale.card_paid) || 0)).toFixed(2)}
                                                </span>
                                            </div>
                                            <div className="d-flex justify-content-between align-items-center mb-1">
                                                <span>UPI UTR / Trans Ref:</span>
                                                <span className="fw-bold text-primary fs-6">
                                                    <code>{reconcilingSale.upi_ref_no || reconcilingSale.card_ref_no || reconcilingSale.payment_reference || 'Not recorded'}</code>
                                                </span>
                                            </div>
                                            <div className="d-flex justify-content-between align-items-center">
                                                <span>Target Bank / A/c:</span>
                                                <span>{reconcilingSale.bank_name || store.bank_name || 'Hospital Current A/c'}</span>
                                            </div>
                                        </div>

                                        <div className="mb-2">
                                            <label className="form-label small fw-bold mb-1">Audited By (Accountant / User)</label>
                                            <input 
                                                type="text" 
                                                className="form-control form-control-sm" 
                                                value={auditorName} 
                                                onChange={(e) => setAuditorName(e.target.value)} 
                                            />
                                        </div>

                                        <div className="mb-3">
                                            <label className="form-label small fw-bold mb-1">Accountant Statement Audit Note</label>
                                            <textarea 
                                                className="form-control form-control-sm" 
                                                rows="2"
                                                value={auditNotes}
                                                onChange={(e) => setAuditNotes(e.target.value)}
                                                placeholder="e.g. Matched in SBI A/c statement entry on 08-Sep-2026, Credit Ref verified"
                                            ></textarea>
                                        </div>
                                    </div>
                                    <div className="modal-footer py-2 px-3 bg-light">
                                        <button type="button" className="btn btn-sm btn-outline-secondary" onClick={() => setReconcilingSale(null)}>
                                            Cancel
                                        </button>
                                        <button 
                                            type="button" 
                                            className="btn btn-sm btn-success fw-bold"
                                            onClick={() => handleReconcileSubmit(reconcilingSale.sale_id, 1)}
                                            disabled={isSubmittingAudit}
                                        >
                                            {isSubmittingAudit ? (
                                                <span><i className="bi bi-hourglass-split me-1"></i> Saving...</span>
                                            ) : (
                                                <span><i className="bi bi-check-circle me-1"></i> Mark Verified with Statement</span>
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            )}

            {accTab === 'gst' && gstData && (
                <div className="counter-card mb-3">
                    <h6 className="fw-bold mb-3"><i className="bi bi-file-earmark-spreadsheet text-primary me-1"></i> GSTR-1 Outward Sales Summary (HSN-wise)</h6>
                    <div className="table-responsive">
                        <table className="table table-pos mb-0">
                            <thead>
                                <tr>
                                    <th>HSN Code</th>
                                    <th>GST Slab</th>
                                    <th>Taxable Value (₹)</th>
                                    <th>CGST (₹)</th>
                                    <th>SGST (₹)</th>
                                    <th>IGST (₹)</th>
                                    <th className="text-end">Total Invoice Value (₹)</th>
                                </tr>
                            </thead>
                            <tbody>
                                {gstData.gstr1_sales.map((g, i) => (
                                    <tr key={i}>
                                        <td><code>{g.hsn_code}</code></td>
                                        <td><span className="badge bg-primary">{g.gst_rate}%</span></td>
                                        <td>₹{Number(g.taxable_val).toFixed(2)}</td>
                                        <td>₹{Number(g.cgst_val).toFixed(2)}</td>
                                        <td>₹{Number(g.sgst_val).toFixed(2)}</td>
                                        <td>₹{Number(g.igst_val).toFixed(2)}</td>
                                        <td className="text-end fw-bold">₹{Number(g.total_val).toFixed(2)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}

            {accTab === 'schedule_h1' && (
                <div className="counter-card">
                    <div className="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h6 className="fw-bold mb-0"><i className="bi bi-shield-check text-success me-1"></i> Statutory Schedule H1 Drug Register</h6>
                            <small className="text-muted">Mandatory under Indian Drugs &amp; Cosmetics Rules (4th Amendment 2013). Retain records for 3 years.</small>
                        </div>
                        <button className="btn btn-sm btn-outline-dark" onClick={() => window.print()}>
                            <i className="bi bi-printer me-1"></i> Export / Print Register
                        </button>
                    </div>

                    <div className="table-responsive">
                        <table className="table table-pos table-bordered mb-0">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Bill No</th>
                                    <th>Patient Name &amp; Address</th>
                                    <th>Prescribing Doctor &amp; Reg No</th>
                                    <th>Medicine Name</th>
                                    <th>Batch No</th>
                                    <th>Qty Supplied</th>
                                </tr>
                            </thead>
                            <tbody>
                                {h1Records.length === 0 ? (
                                    <tr>
                                        <td colSpan="7" className="text-center py-4 text-muted">No Schedule H1 medicines dispensed in this period.</td>
                                    </tr>
                                ) : (
                                    h1Records.map((h, i) => (
                                        <tr key={i}>
                                            <td>{h.sale_date.split(' ')[0]}</td>
                                            <td className="fw-bold">{h.invoice_no}</td>
                                            <td>{h.patient_name} {h.patient_address ? `(${h.patient_address})` : ''}</td>
                                            <td>{h.doctor_name} {h.doctor_reg_no ? `(Reg: ${h.doctor_reg_no})` : ''}</td>
                                            <td className="fw-bold text-danger">{h.item_name}</td>
                                            <td><code>{h.batch_no}</code></td>
                                            <td className="fw-bold">{h.qty}</td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}
        </div>
    );
}

// Note: Store & Statutory Licensing Setup is managed centrally in HMS -> Admin -> Medical Store.

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(
    <ErrorBoundary>
        <App />
    </ErrorBoundary>
);
</script>

</body>
</html>
