                            <span className="fw-bold" style={{ color: '#0f172a' }}>Patient</span>
                        </span>
                        <span className="d-inline-flex align-items-center gap-1 px-2 py-0.5 bg-white rounded border shadow-xs" style={{ fontSize: '0.72rem' }}>
                            <kbd style={{ background: '#0f172a', color: '#a855f7', fontWeight: 800, padding: '1px 5px', borderRadius: '3px', fontSize: '0.68rem' }}>F8</kbd>
                            <span className="fw-bold" style={{ color: '#0f172a' }}>Payment</span>
                        </span>
                        <button 
                            type="button" 
                            className="btn btn-xs py-0.5 px-2 bg-white rounded border border-danger shadow-xs d-inline-flex align-items-center gap-1"
                            onClick={openReturnModal}
                            style={{ fontSize: '0.72rem' }}
                            title="Accept patient returns or exchange on current bill (Alt+R / F6)"
                        >
                            <kbd style={{ background: '#e11d48', color: '#ffffff', fontWeight: 800, padding: '1px 5px', borderRadius: '3px', fontSize: '0.68rem' }}>Alt+R / F6</kbd>
                            <span className="fw-bold text-danger">Return / Exch</span>
                        </button>
                        <span className="d-inline-flex align-items-center gap-1 px-2.5 py-0.5 rounded text-white shadow-sm" style={{ background: '#059669', fontSize: '0.72rem', border: '1px solid #047857' }}>
                            <kbd style={{ background: '#ffffff', color: '#065f46', fontWeight: 800, padding: '1px 5px', borderRadius: '3px', fontSize: '0.68rem' }}>F9 / Ctrl+↵</kbd>
                            <span className="fw-bold">Bill &amp; Print</span>
                        </span>
                    </div>

                    <div className="d-flex align-items-center gap-2 mb-2">
                        <i className="bi bi-upc-scan text-primary fs-5"></i>
                        <span className="fw-bold fs-6">Medicine Lookup &amp; Barcode Dispenser</span>
                    </div>

                    <div className="input-group">
                        <span className="input-group-text bg-light text-primary fw-bold" style={{ fontSize: '0.75rem' }}>
                            <kbd className="me-1" style={{ background: '#0f172a', color: '#38bdf8', fontWeight: 800, padding: '1px 5px', borderRadius: '3px' }}>F2</kbd>
                            <i className="bi bi-capsule"></i>
                        </span>
                        <input 
                            type="text" 
                            id="item-search-input"
                            ref={medicineSearchRef}
                            className="form-control fw-semibold" 
                            placeholder="Type Medicine Name, Generic Molecule, or Scan Box Barcode... (Press F2 anytime)" 
                            value={itemQuery}
                            onChange={(e) => searchItems(e.target.value)}
                            onKeyDown={handleMedicineSearchKeyDown}
                            autoComplete="off"
                        />
                        {isSearchingItems && <span className="input-group-text bg-light"><i className="bi bi-hourglass-split"></i></span>}
                    </div>

                    {/* Item & FEFO Batch Dropdown */}
                    {itemResults.length > 0 && (
                        <div className="search-results-dropdown">
                            {itemResults.map(it => (
                                <div key={it.item_id} className="search-item-row">
                                    <div className="d-flex justify-content-between align-items-center mb-1">
                                        <div>
                                            <span className="fw-bold text-dark fs-6">{it.item_name}</span>
                                            <span className="badge bg-secondary ms-2" style={{ fontSize: '0.65rem' }}>{it.unit_pack}</span>
                                            {it.drug_schedule && it.drug_schedule !== 'OTC' && (
                                                <span className="badge bg-warning-subtle text-warning border border-warning ms-1" style={{ fontSize: '0.65rem' }}>
                                                    {it.drug_schedule}
                                                </span>
                                            )}
                                        </div>
                                        <div>
                                            <span className="text-muted me-2" style={{ fontSize: '0.75rem' }}>Total Stock: {it.total_stock}</span>
                                        </div>
                                    </div>
                                    <small className="text-muted d-block mb-1"><i className="bi bi-diagram-3 me-1"></i>{it.generic_name} • HSN: {it.hsn_code}</small>
                                    
                                    {/* Batches Table */}
                                    {it.batches && it.batches.length > 0 ? (
                                        <div className="d-flex flex-wrap gap-2 mt-1">
                                            {it.batches.map(b => {
                                                const isHighlighted = selectableBatches[selectedBatchIndex] && 
                                                                      selectableBatches[selectedBatchIndex].batch.batch_id === b.batch_id &&
                                                                      selectableBatches[selectedBatchIndex].item.item_id === it.item_id;
                                                return (
                                                    <button 
                                                        key={b.batch_id}
                                                        className={`btn btn-sm ${isHighlighted ? 'btn-warning text-dark border-2 shadow-sm fw-bold' : (b.is_expired ? 'btn-outline-danger disabled' : 'btn-outline-dark')} d-flex align-items-center gap-1 py-0.5 px-2`}
                                                        style={{ fontSize: '0.75rem', transform: isHighlighted ? 'scale(1.04)' : 'scale(1)', transition: 'transform 0.1s' }}
                                                        onClick={() => addItemToCart(it, b, 1)}
                                                        disabled={b.is_expired}
                                                        title={isHighlighted ? 'Press Enter to select this batch' : `Select batch ${b.batch_no}`}
                                                    >
                                                        <strong>{b.batch_no}</strong>
                                                        <span>(Exp: {b.expiry_display})</span>
                                                        <span className="text-success fw-bold">₹{b.mrp}</span>
                                                        <span className="badge bg-primary text-white">{b.current_qty} left</span>
                                                        {it.fefo_batch && it.fefo_batch.batch_id === b.batch_id && (
                                                            <span className="badge-fefo ms-1">FEFO</span>
                                                        )}
                                                        {b.is_near_expiry && (
                                                            <span className="badge-near-expiry ms-1">Near Exp</span>
                                                        )}
                                                        {b.is_expired && (
                                                            <span className="badge-expired ms-1">EXPIRED</span>
                                                        )}
                                                        {isHighlighted && (
                                                            <span className="badge bg-dark text-warning ms-1" style={{ fontSize: '0.62rem' }}>↵ Enter</span>
                                                        )}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <span className="text-danger fw-bold" style={{ fontSize: '0.75rem' }}>Out of Stock in this Counter</span>
                                    )}
                                </div>
                            ))}
                        </div>
                    )}
                </div>

                {/* Billing Cart Table */}
                <div className="counter-card p-0 overflow-hidden">
                    <div className="p-3 pb-2 d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom">
                        <div className="d-flex align-items-center gap-2">
                            <h6 className="mb-0 fw-bold"><i className="bi bi-cart-check-fill text-success me-1"></i> Dispensing Cart ({cart.length} new)</h6>
                            {returnCart.length > 0 && (
                                <span className="badge bg-danger-subtle text-danger border border-danger">
                                    <i className="bi bi-arrow-return-left me-1"></i>{returnCart.length} return/exchange
                                </span>
                            )}
                        </div>
                        <div className="d-flex gap-2 align-items-center">
                            <button 
                                type="button" 
                                className="btn btn-sm btn-outline-danger py-0.5 px-2.5 fw-semibold d-inline-flex align-items-center gap-1"
                                onClick={openReturnModal}
                                style={{ fontSize: '0.75rem' }}
                                title="Add patient return or item exchange (Alt+R / F6)"
                            >
                                <i className="bi bi-arrow-return-left"></i> Add Return / Exch
                            </button>
                            {(cart.length > 0 || returnCart.length > 0) && (
                                <button className="btn btn-sm btn-link text-muted text-decoration-none p-0" onClick={() => { setCart([]); setReturnCart([]); }}>
                                    Clear All
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="table-responsive" style={{ maxHeight: 380 }}>
                        <table className="table table-pos mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Medicine Name</th>
                                    <th>Batch / Exp</th>
                                    <th style={{ width: 155 }}>Qty &amp; Unit</th>
                                    <th>Rate (₹)</th>
                                    <th style={{ width: 125 }}>Disc (% / ₹)</th>
                                    <th>GST%</th>
                                    <th className="text-end">Total (₹)</th>
                                    <th style={{ width: 40 }}></th>
                                </tr>
                            </thead>
                            <tbody>
                                {cart.length === 0 && returnCart.length === 0 ? (
                                    <tr>
                                        <td colSpan="9" className="text-center py-4 text-muted">
                                            <i className="bi bi-basket3 fs-3 d-block mb-1"></i>
                                            Scan barcode or search medicine to add items, or click <strong className="text-danger">Add Return / Exch</strong> (Alt+R / F6).
                                        </td>
                                    </tr>
                                ) : (
                                    cart.map((it, idx) => {
                                        const info = getItemLineInfo(it);
                                        const lineGross = info.lineGross;
                                        const lineDisc = getItemDiscount(it);
                                        const lineNet = Math.max(0, lineGross - lineDisc).toFixed(2);
                                        const upp = info.upp;
                                        return (
                                            <tr key={`sale-${idx}`}>
                                                <td>{idx + 1}</td>
                                                <td>
                                                    <div className="fw-bold">{it.item_name}</div>
                                                    <small className="text-muted">{it.generic_name} • HSN: {it.hsn_code}</small>
                                                    {upp > 1 && (
                                                        <span className="badge bg-secondary-subtle text-secondary border ms-1" style={{ fontSize: '0.62rem' }}>
                                                            Pack: {it.unit_pack || `${upp} Tabs`}
                                                        </span>
                                                    )}
                                                </td>
                                                <td>
                                                    <span className="badge bg-light text-dark border">{it.batch_no}</span>
                                                    <div className="text-muted" style={{ fontSize: '0.7rem' }}>Exp: {it.expiry_display}</div>
                                                </td>
                                                <td>
                                                    {upp > 1 ? (
                                                        <div style={{ maxWidth: 155 }}>
                                                            {it.sell_unit === 'Combo' ? (
                                                                <div className="input-group input-group-sm">
                                                                    <select 
                                                                        className="form-select form-select-sm py-0 px-1 fw-bold bg-warning-subtle text-dark border-warning"
                                                                        style={{ maxWidth: 64, fontSize: '0.72rem' }}
                                                                        value={it.sell_unit}
                                                                        onChange={(e) => switchSellUnit(idx, e.target.value)}
                                                                        title="Unit Type: Combo (Strips + Loose Tablets)"
                                                                    >
                                                                        <option value="Tablet">Tab</option>
                                                                        <option value="Strip">Strip</option>
                                                                        <option value="Combo">Str+Tab</option>
                                                                    </select>
                                                                    <input 
                                                                        type="number" 
                                                                        id={`cart-qty-strip-${idx}`}
                                                                        className="form-control form-control-sm text-center fw-bold px-1" 
                                                                        min="0"
                                                                        placeholder="Str"
                                                                        title="Whole Strips"
                                                                        value={it.strip_qty ?? 1} 
                                                                        onChange={(e) => updateCartItem(idx, 'strip_qty', Number(e.target.value))}
                                                                        onKeyDown={(e) => {
                                                                            if (e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                focusMedicineSearch();
                                                                            } else if (e.key === 'Delete' && e.shiftKey) {
                                                                                e.preventDefault();
                                                                                removeCartItem(idx);
                                                                                focusMedicineSearch();
                                                                            }
                                                                        }}
                                                                    />
                                                                    <input 
                                                                        type="number" 
                                                                        id={`cart-qty-loose-${idx}`}
                                                                        className="form-control form-control-sm text-center fw-bold text-success border-success px-1" 
                                                                        min="0"
                                                                        placeholder="Tab"
                                                                        title="Loose Tablets"
                                                                        value={it.loose_qty ?? 0} 
                                                                        onChange={(e) => updateCartItem(idx, 'loose_qty', Number(e.target.value))}
                                                                        onKeyDown={(e) => {
                                                                            if (e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                focusMedicineSearch();
                                                                            } else if (e.key === 'Delete' && e.shiftKey) {
                                                                                e.preventDefault();
                                                                                removeCartItem(idx);
                                                                                focusMedicineSearch();
                                                                            }
                                                                        }}
                                                                    />
                                                                </div>
                                                            ) : (
                                                                <div className="input-group input-group-sm">
                                                                    <select 
                                                                        className={`form-select form-select-sm py-0 px-1 fw-bold ${it.sell_unit === 'Strip' ? 'bg-primary-subtle text-primary border-primary' : 'bg-success-subtle text-success border-success'}`}
                                                                        style={{ maxWidth: 65, fontSize: '0.72rem' }}
                                                                        value={it.sell_unit || 'Tablet'}
                                                                        onChange={(e) => switchSellUnit(idx, e.target.value)}
                                                                        title="Select Unit Type before quantity"
                                                                    >
                                                                        <option value="Tablet">Tab</option>
                                                                        <option value="Strip">Strip</option>
                                                                        <option value="Combo">Str+Tab</option>
                                                                    </select>
                                                                    <input 
                                                                        type="number" 
                                                                        id={it.sell_unit === 'Strip' ? `cart-qty-strip-${idx}` : `cart-qty-loose-${idx}`}
                                                                        className={`form-control form-control-sm text-center fw-bold ${it.sell_unit === 'Strip' ? 'text-primary' : 'text-success border-success'}`}
                                                                        min="1" 
                                                                        max={it.current_qty}
                                                                        value={it.sell_unit === 'Strip' ? (it.strip_qty ?? it.qty ?? 1) : (it.loose_qty ?? it.qty ?? 1)} 
                                                                        onChange={(e) => {
                                                                            const val = Number(e.target.value);
                                                                            const updated = [...cart];
                                                                            if (it.sell_unit === 'Strip') {
                                                                                updated[idx].strip_qty = val;
                                                                            } else {
                                                                                updated[idx].loose_qty = val;
                                                                            }
                                                                            updated[idx].qty = val;
                                                                            setCart(updated);
                                                                        }}
                                                                        onKeyDown={(e) => {
                                                                            if (e.key === 'Enter') {
                                                                                e.preventDefault();
                                                                                focusMedicineSearch();
                                                                            } else if (e.altKey && (e.key === 's' || e.key === 'S')) {
                                                                                e.preventDefault();
                                                                                switchSellUnit(idx, 'Strip');
                                                                            } else if (e.altKey && (e.key === 't' || e.key === 'T')) {
                                                                                e.preventDefault();
                                                                                switchSellUnit(idx, 'Tablet');
                                                                            } else if (e.altKey && (e.key === 'c' || e.key === 'C')) {
                                                                                e.preventDefault();
                                                                                switchSellUnit(idx, 'Combo');
                                                                            } else if (e.key === 'Delete' && e.shiftKey) {
                                                                                e.preventDefault();
                                                                                removeCartItem(idx);
                                                                                focusMedicineSearch();
                                                                            }
                                                                        }}
                                                                    />
                                                                </div>
                                                            )}
                                                            <div className="text-muted text-center mt-0.5" style={{ fontSize: '0.64rem' }}>
                                                                {it.sell_unit === 'Tablet' ? `= ${info.totalUnits} Tab (₹${info.perUnitMrp}/tab)` : (it.sell_unit === 'Combo' ? `= ${info.totalUnits} Tab total` : `= ${info.totalUnits} Tab (${upp}/str)`)}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div style={{ maxWidth: 120 }}>
                                                            <div className="input-group input-group-sm">
                                                                <span className="input-group-text bg-light text-muted px-1.5 py-0 fw-semibold" style={{ fontSize: '0.68rem', maxWidth: 50 }}>
                                                                    {it.unit_pack || 'Unit'}
                                                                </span>
                                                                <input 
                                                                    type="number" 
                                                                    id={`cart-qty-strip-${idx}`}
                                                                    className="form-control form-control-sm text-center fw-bold" 
                                                                    min="1" 
                                                                    max={it.current_qty}
                                                                    value={it.qty} 
                                                                    onChange={(e) => updateCartItem(idx, 'qty', Number(e.target.value))}
                                                                    onKeyDown={(e) => {
                                                                        if (e.key === 'Enter') {
                                                                            e.preventDefault();
                                                                            focusMedicineSearch();
                                                                        } else if (e.key === 'Delete' && e.shiftKey) {
                                                                            e.preventDefault();
                                                                            removeCartItem(idx);
                                                                            focusMedicineSearch();
                                                                        }
                                                                    }}
                                                                />
                                                            </div>
                                                            <div className="text-muted text-center mt-0.5" style={{ fontSize: '0.64rem' }}>
                                                                ₹{it.unit_mrp} each
                                                            </div>
                                                        </div>
                                                    )}
                                                </td>
                                                <td>
                                                    <div className="fw-semibold">
                                                        {it.sell_unit === 'Tablet' ? (
                                                            <span>₹{info.perUnitMrp} <small className="text-muted">/tab</small></span>
                                                        ) : it.sell_unit === 'Combo' ? (
                                                            <span>₹{it.unit_mrp} <small className="text-muted">/str</small></span>
                                                        ) : (
                                                            <span>₹{it.unit_mrp} {upp > 1 ? <small className="text-muted">/strip</small> : ''}</span>
                                                        )}
                                                    </div>
                                                    {upp > 1 && (
                                                        <small className="text-muted d-block" style={{ fontSize: '0.68rem' }}>
                                                            {it.sell_unit === 'Tablet' ? `Strip: ₹${it.unit_mrp}` : `Tab: ₹${info.perUnitMrp}`}
                                                        </small>
                                                    )}
                                                </td>
                                                <td>
                                                    <div className="input-group input-group-sm" style={{ width: 115 }}>
                                                        <input 
                                                            type="number" 
                                                            id={`cart-disc-${idx}`}
                                                            className="form-control form-control-sm text-center px-1 fw-semibold" 
                                                            min="0" 
                                                            max={it.discount_type === 'pct' ? 100 : lineGross}
                                                            step={it.discount_type === 'pct' ? '0.5' : '1'}
                                                            value={it.discount_val ?? ''} 
                                                            placeholder="0"
                                                            onChange={(e) => updateCartItem(idx, 'discount_val', e.target.value)}
                                                            onKeyDown={(e) => {
                                                                if (e.key === 'Enter') {
                                                                    e.preventDefault();
                                                                    focusMedicineSearch();
                                                                }
                                                            }}
                                                        />
                                                        <button 
                                                            type="button" 
                                                            className={`btn btn-sm ${it.discount_type === 'pct' ? 'btn-primary' : 'btn-warning text-dark'} px-2 py-0 fw-bold`}
                                                            title={`Click to switch between % and ₹ (Currently: ${it.discount_type === 'pct' ? 'Percentage' : 'Value in Rupees'})`}
                                                            onClick={() => toggleItemDiscType(idx)}
                                                        >
                                                            {it.discount_type === 'pct' ? '%' : '₹'}
                                                        </button>
                                                    </div>
                                                    {lineDisc > 0 && (
                                                        <div className="text-muted text-center mt-0.5" style={{ fontSize: '0.68rem' }}>
                                                            {it.discount_type === 'pct' 
                                                                ? `-₹${lineDisc.toFixed(2)}` 
                                                                : `${(lineGross > 0 ? ((lineDisc / lineGross) * 100).toFixed(1) : 0)}% off`}
                                                        </div>
                                                    )}
                                                </td>
                                                <td>{it.gst_rate}%</td>
                                                <td className="text-end fw-bold text-dark">₹{lineNet}</td>
                                                <td>
                                                    <button className="btn btn-sm btn-outline-danger py-0 px-1" onClick={() => removeCartItem(idx)}>
                                                        <i className="bi bi-trash"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    }).concat(
                                        returnCart.map((rc, rIdx) => (
                                            <tr key={`ret-${rIdx}`} style={{ backgroundColor: 'rgba(244, 63, 94, 0.05)' }}>
                                                <td>
                                                    <span className="badge bg-danger text-white">RET</span>
                                                </td>
                                                <td>
                                                    <div className="fw-bold text-danger">
                                                        <i className="bi bi-arrow-return-left me-1"></i>
                                                        {rc.item_name}
                                                    </div>
                                                    <small className="text-muted">
                                                        Bill: <code>{rc.ref_invoice_no}</code> • {rc.reason ? rc.reason.replace(/_/g, ' ') : 'Return'}
                                                    </small>
                                                </td>
                                                <td>
                                                    <span className="badge bg-light text-dark border">{rc.batch_no}</span>
                                                    <div className="text-muted" style={{ fontSize: '0.7rem' }}>Exp: {rc.expiry_date ? rc.expiry_date.substring(0,7) : ''}</div>
                                                </td>
                                                <td>
                                                    <span className="badge bg-danger-subtle text-danger border border-danger fw-bold">
                                                        - {rc.return_qty} {rc.return_unit}
                                                    </span>
                                                    <div className="text-muted mt-0.5" style={{ fontSize: '0.64rem' }}>
                                                        ({rc.return_total_units} Tabs • {rc.condition === 'GOOD' ? 'Restocking' : 'Discard'})
                                                    </div>
                                                </td>
                                                <td>
                                                    <div className="fw-semibold text-danger">
                                                        ₹{rc.unit_price} <small className="text-muted">/tab</small>
                                                    </div>
                                                    {rc.units_per_pack > 1 && (
                                                        <small className="text-muted d-block" style={{ fontSize: '0.68rem' }}>
                                                            MRP: ₹{rc.unit_mrp}
                                                        </small>
                                                    )}
                                                </td>
                                                <td>
                                                    <span className="badge bg-secondary-subtle text-secondary" style={{ fontSize: '0.7rem' }}>
                                                        {rc.condition === 'GOOD' ? 'Restock' : 'Scrap'}
                                                    </span>
                                                </td>
                                                <td>{rc.gst_rate || 12}%</td>
                                                <td className="text-end fw-bold text-danger">
                                                    -₹{Number(rc.line_total).toFixed(2)}
                                                </td>
                                                <td>
                                                    <button 
                                                        className="btn btn-sm btn-outline-danger py-0 px-1" 
                                                        onClick={() => setReturnCart(returnCart.filter((_, i) => i !== rIdx))}
                                                        title="Remove from returns"
                                                    >
                                                        <i className="bi bi-trash"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))
                                    )
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            {/* Right Column: Checkout, Totals & Multi-Format Printing */}
            <div className="col-lg-4">
                <div className="pos-summary-card">
                    <h5 className="fw-bold text-white mb-3 d-flex justify-content-between align-items-center">
                        <span>Checkout Desk</span>
                        <span className="fs-6 text-primary">{store?.store_code || ''}</span>
                    </h5>

                    {/* Whole Bill Discount Controller */}
                    <div className="p-2.5 rounded-3 mb-3" style={{ background: 'rgba(255, 255, 255, 0.08)', border: '1px solid rgba(255, 255, 255, 0.15)' }}>
                        <div className="d-flex justify-content-between align-items-center mb-1.5">
                            <label className="text-white small fw-bold mb-0 d-flex align-items-center gap-1">
                                <i className="bi bi-tag-fill text-warning"></i> Whole Bill Discount
                            </label>
                            <div className="btn-group btn-group-sm">
                                <button 
                                    type="button" 
                                    className={`btn btn-xs py-0.5 px-2 ${wholeDiscountType === 'pct' ? 'btn-warning text-dark fw-bold' : 'btn-outline-light text-white'}`}
                                    style={{ fontSize: '0.72rem' }}
                                    onClick={() => setWholeDiscountType('pct')}
                                >
                                    % Percent
                                </button>
                                <button 
                                    type="button" 
                                    className={`btn btn-xs py-0.5 px-2 ${wholeDiscountType === 'val' ? 'btn-warning text-dark fw-bold' : 'btn-outline-light text-white'}`}
                                    style={{ fontSize: '0.72rem' }}
                                    onClick={() => setWholeDiscountType('val')}
                                >
                                    ₹ Fixed Value
                                </button>
                            </div>
                        </div>

                        <div className="input-group input-group-sm mb-2">
                            <span className="input-group-text bg-dark border-secondary text-warning fw-bold">
                                {wholeDiscountType === 'pct' ? '%' : '₹'}
                            </span>
                            <input 
                                type="number" 
                                id="whole-discount-input"
                                ref={wholeDiscountRef}
                                className="form-control form-control-sm bg-dark text-white border-secondary fw-bold" 
                                min="0"
                                max={wholeDiscountType === 'pct' ? 100 : balanceAfterItemDisc}
                                step={wholeDiscountType === 'pct' ? '0.5' : '1'}
                                placeholder={wholeDiscountType === 'pct' ? 'Enter % (F7)' : 'Enter ₹ (F7)'}
                                value={wholeDiscountVal || ''} 
                                onChange={(e) => setWholeDiscountVal(e.target.value)}
                                onKeyDown={(e) => {
                                    if (e.key === 'Enter') {
                                        e.preventDefault();
                                        if (!isProcessing && cart.length > 0) {
                                            processSale();
                                        }
                                    }
                                }}
                            />
                            {Number(wholeDiscountVal) > 0 && (
                                <button 
                                    type="button" 
                                    className="btn btn-sm btn-outline-danger" 
                                    title="Reset Whole Bill Discount"
                                    onClick={() => setWholeDiscountVal(0)}
                                >
                                    <i className="bi bi-x-lg"></i>
                                </button>
                            )}
                        </div>

                        {/* Quick Preset Buttons */}
                        <div className="d-flex flex-wrap gap-1 align-items-center">
                            <small className="text-slate-400 me-1" style={{ fontSize: '0.7rem', color: '#94a3b8' }}>Presets:</small>
                            {wholeDiscountType === 'pct' ? (
                                [5, 10, 15, 20].map(p => (
                                    <button 
                                        key={p} 
                                        type="button" 
                                        className={`badge border ${Number(wholeDiscountVal) === p ? 'bg-warning text-dark border-warning' : 'bg-transparent text-white border-secondary'}`}
                                        style={{ cursor: 'pointer', padding: '4px 8px', fontSize: '0.7rem' }}
                                        onClick={() => setWholeDiscountVal(p)}
                                    >
                                        {p}%
                                    </button>
                                ))
                            ) : (
                                [20, 50, 100, 200].map(v => (
                                    <button 
                                        key={v} 
                                        type="button" 
                                        className={`badge border ${Number(wholeDiscountVal) === v ? 'bg-warning text-dark border-warning' : 'bg-transparent text-white border-secondary'}`}
                                        style={{ cursor: 'pointer', padding: '4px 8px', fontSize: '0.7rem' }}
                                        onClick={() => setWholeDiscountVal(v)}
                                    >
                                        ₹{v}
                                    </button>
                                ))
                            )}
                            {Number(wholeDiscountVal) > 0 && (
                                <button 
                                    type="button" 
                                    className="badge bg-danger-subtle text-danger border border-danger ms-auto"
                                    style={{ cursor: 'pointer', padding: '4px 6px', fontSize: '0.7rem' }}
                                    onClick={() => setWholeDiscountVal(0)}
                                >
                                    Clear
                                </button>
                            )}
                        </div>

                                                                        {isEligible && qty > 0 ? (
                                                                            <select
                                                                                className="form-select form-select-sm"
                                                                                value={draft.reason}
                                                                                onChange={(e) => updateReturnDraft(it.sale_item_id, 'reason', e.target.value)}
                                                                            >
                                                                                <option value="EXCESS_UNUSED">Excess / Unused</option>
                                                                                <option value="DOCTOR_CHANGED_RX">Doctor Changed Rx</option>
                                                                                <option value="PATIENT_DISCHARGED">Patient Discharged</option>
                                                                                <option value="WRONG_MEDICINE">Wrong Dispense</option>
                                                                            </select>
                                                                        ) : (
                                                                            <span className="text-muted small">-</span>
                                                                        )}
                                                                    </td>
                                                                    <td>
                                                                        ₹{it.effective_unit_price} <small className="text-muted">/tab</small>
                                                                        {upp > 1 && <div className="text-muted" style={{ fontSize: '0.72rem' }}>₹{(it.effective_unit_price * upp).toFixed(2)}/str</div>}
                                                                    </td>
                                                                    <td className="text-end fw-bold">
                                                                        {qty > 0 ? (
                                                                            <span className="text-danger">-₹{lineCredit.toFixed(2)}</span>
                                                                        ) : (
                                                                            <span className="text-muted">₹0.00</span>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {!selectedReturnInvoice && returnSearchResults.length === 0 && (
                                        <div className="text-center py-5 text-muted bg-white rounded border">
                                            <i className="bi bi-receipt-cutoff fs-1 text-secondary mb-2 d-block"></i>
                                            <div className="fw-bold">No Invoice Selected</div>
                                            <div className="small">Search by Bill Number, Patient UHID, Name, or Mobile to load returnable items.</div>
                                        </div>
                                    )}
                                </div>
                                <div className="modal-footer py-2 px-3 bg-white d-flex justify-content-between align-items-center">
                                    <div>
                                        {selectedReturnInvoice && (
                                            <div className="d-flex align-items-center gap-3">
                                                {(() => {
                                                    let totalCredit = 0;
                                                    let totalItemsCount = 0;
                                                    selectedReturnInvoice.items.forEach(it => {
                                                        const draft = returnDraftItems[it.sale_item_id];
                                                        if (draft && Number(draft.return_qty) > 0) {
                                                            const qty = Number(draft.return_qty);
                                                            const upp = Number(it.units_per_pack) || 1;
                                                            const tu = draft.return_unit === 'Strip' ? (qty * upp) : qty;
                                                            totalCredit += (tu * it.effective_unit_price);
                                                            totalItemsCount++;
                                                        }
                                                    });
                                                    return (
                                                        <div>
                                                            <span className="text-muted small me-2">Selected Items: <strong>{totalItemsCount}</strong></span>
                                                            <span className="text-danger fw-bold fs-6">
                                                                Total Return Credit: -₹{totalCredit.toFixed(2)}
                                                            </span>
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        )}
                                    </div>
                                    <div className="d-flex gap-2">
                                        <button type="button" className="btn btn-secondary btn-sm" onClick={() => setShowReturnModal(false)}>
                                            Cancel
                                        </button>
                                        <button
                                            type="button"
                                            className="btn btn-danger btn-sm px-3 fw-bold"
                                            disabled={!selectedReturnInvoice}
                                            onClick={addSelectedReturnsToBill}
                                        >
                                            <i className="bi bi-cart-plus me-1"></i> Add to Current Bill (Exchange / Net-Off)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
}

function InventoryView({ store, notify }) {
    if (!store) return null;
    const [stock, setStock] = useState([]);
    const [summary, setSummary] = useState({});
    const [filter, setFilter] = useState('all');
    const [searchTerm, setSearchTerm] = useState('');
    const [loading, setLoading] = useState(false);

    useEffect(() => {
        if (store?.store_id) {
            loadStock();
        }
    }, [store?.store_id, filter]);

    const loadStock = async () => {
        setLoading(true);
        try {
            const res = await fetch(API_BASE + `stock/list?store_id=${store.store_id}&filter=${filter}`);
            const data = await res.json();
            if (data.status) {
                setStock(data.stock || []);
                setSummary(data.summary || {});
            }
        } catch (e) {
            console.error(e);
        } finally {
            setLoading(false);
        }
    };

    const filteredStock = stock.filter(s => 
        s.item_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
        (s.generic_name && s.generic_name.toLowerCase().includes(searchTerm.toLowerCase())) ||
        s.batch_no.toLowerCase().includes(searchTerm.toLowerCase())
    );

    return (
        <div>
            {/* KPI Summary Cards */}
            <div className="row g-3 mb-3">
                <div className="col-md-3 col-sm-6">
                    <div className="counter-card p-3 border-start border-4 border-primary">
                        <small className="text-muted fw-bold text-uppercase">Total Batches in Store</small>
                        <h4 className="fw-bolder text-dark mt-1 mb-0">{summary.total_rows || 0}</h4>
                    </div>
                </div>
                <div className="col-md-3 col-sm-6">
                    <div className="counter-card p-3 border-start border-4 border-success">
                        <small className="text-muted fw-bold text-uppercase">Stock Cost Valuation (PTR)</small>
                        <h4 className="fw-bolder text-success mt-1 mb-0">₹{(summary.total_cost_valuation || 0).toLocaleString('en-IN')}</h4>
                    </div>
                </div>
                <div className="col-md-3 col-sm-6">
                    <div className="counter-card p-3 border-start border-4 border-warning">
                        <small className="text-muted fw-bold text-uppercase">Stock Retail Valuation (MRP)</small>
                        <h4 className="fw-bolder text-dark mt-1 mb-0">₹{(summary.total_mrp_valuation || 0).toLocaleString('en-IN')}</h4>
                    </div>
                </div>
                <div className="col-md-3 col-sm-6">
                    <div className="counter-card p-3 border-start border-4 border-info">
                        <small className="text-muted fw-bold text-uppercase">Counter / URL</small>
                        <h6 className="fw-bolder text-primary mt-1 mb-0 text-truncate">MedicalStore/{store.store_slug}</h6>
                    </div>
                </div>
            </div>

            {/* Filter Tabs & Search Bar */}
            <div className="counter-card p-3 mb-3">
                <div className="d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <div className="btn-group btn-group-sm">
                        <button className={`btn ${filter === 'all' ? 'btn-primary' : 'btn-outline-secondary'}`} onClick={() => setFilter('all')}>
                            All Stock
                        </button>
                        <button className={`btn ${filter === 'low' ? 'btn-primary' : 'btn-outline-secondary'}`} onClick={() => setFilter('low')}>
                            <i className="bi bi-arrow-down-circle me-1"></i> Low Stock
                        </button>
                        <button className={`btn ${filter === 'near_expiry' ? 'btn-warning' : 'btn-outline-secondary'}`} onClick={() => setFilter('near_expiry')}>
                            <i className="bi bi-clock-history me-1"></i> Near Expiry (&lt;90 Days)
                        </button>
                        <button className={`btn ${filter === 'expired' ? 'btn-danger' : 'btn-outline-secondary'}`} onClick={() => setFilter('expired')}>
                            <i className="bi bi-shield-x me-1"></i> Expired Stock
                        </button>
                    </div>

                    <div style={{ maxWidth: 300 }} className="w-100">
                        <input 
                            type="text" 
                            className="form-control form-control-sm" 
                            placeholder="Search item, molecule, batch..." 
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                    </div>
                </div>
            </div>

            {/* Stock Table */}
            <div className="counter-card p-0 overflow-hidden">
                <div className="table-responsive">
                    <table className="table table-pos table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Item &amp; Generic Molecule</th>
                                <th>Category</th>
                                <th>Batch No</th>
                                <th>Expiry</th>
                                <th>Current Qty</th>
                                <th>PTR (₹)</th>
                                <th>MRP (₹)</th>
                                <th>Cost Value (₹)</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {loading ? (
                                <tr>
                                    <td colSpan="10" className="text-center py-4 text-muted">
                                        <i className="bi bi-hourglass-split fs-4 d-block mb-1"></i> Loading inventory...
                                    </td>
                                </tr>
                            ) : filteredStock.length === 0 ? (
                                <tr>
                                    <td colSpan="10" className="text-center py-4 text-muted">No stock records found.</td>
                                </tr>
                            ) : (
                                filteredStock.map((s, idx) => (
                                    <tr key={s.stock_id}>
                                        <td>{idx + 1}</td>
                                        <td>
                                            <div className="fw-bold">{s.item_name}</div>
                                            <small className="text-muted">{s.generic_name} • HSN: {s.hsn_code}</small>
                                        </td>
                                        <td><span className="badge bg-secondary-subtle text-secondary">{s.category}</span></td>
                                        <td><span className="badge bg-light text-dark border fw-bold">{s.batch_no}</span></td>
                                        <td>{s.expiry_display}</td>
                                        <td>
                                            <span className={`fw-bold fs-6 ${s.current_qty <= s.min_reorder_level ? 'text-danger' : 'text-success'}`}>
                                                {s.current_qty}
                                            </span>
                                        </td>
                                        <td>₹{s.ptr}</td>
                                        <td className="fw-semibold">₹{s.mrp}</td>
                                        <td className="fw-bold">₹{s.cost_valuation}</td>
                                        <td>
                                            {s.is_expired ? (
                                                <span className="badge-expired">EXPIRED</span>
                                            ) : s.is_near_expiry ? (
                                                <span className="badge-near-expiry">Near Expiry</span>
                                            ) : (
                                                <span className="badge-fefo">Good Stock</span>
                                            )}
                                        </td>
                                    </tr>
                                ))
                            )}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    );
}
