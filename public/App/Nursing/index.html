<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nursing Care - HMS Mobile</title>
    <link rel="manifest" href="/App/Nursing/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/img/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/img/logo.png">
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: data:; object-src 'none';">

    <!-- Bootstrap 5 CSS & Icons -->
    <link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.css">
    
    <!-- React 18 & ReactDOM UMD (Local) -->
    <script src="/assets/vendor/react/react.production.min.js"></script>
    <script src="/assets/vendor/react/react-dom.production.min.js"></script>

    <!-- Cropper.js for Document Photo Cropping (Local) -->
    <link rel="stylesheet" href="/assets/vendor/cropperjs/cropper.min.css">
    <script src="/assets/vendor/cropperjs/cropper.min.js"></script>

    <!-- HTML5 QR & Barcode Scanner (Local) -->
    <script src="/assets/vendor/html5-qrcode/html5-qrcode.min.js"></script>

    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: #ffffff;
            --accent-blue: #2563eb;
            --accent-cyan: #0891b2;
            --accent-green: #16a34a;
            --accent-amber: #d97706;
            --accent-red: #dc2626;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            color: #334155;
        }

        /* Android TV D-Pad Remote Focus Glow Outline */
        :focus-visible, button:focus, select:focus, input:focus, .card:focus, a:focus {
            outline: 3px solid #2563eb !important;
            outline-offset: 2px !important;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.6) !important;
        }

        /* Topbar Header */
        .nursing-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 12px 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .patient-avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            border: 1.5px solid #dbeafe;
            flex-shrink: 0;
        }

        /* Segmented Tabs */
        .segmented-tabs {
            background: #e2e8f0;
            border-radius: 12px;
            padding: 4px;
            display: flex;
            gap: 4px;
        }

        .segmented-tab {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 13px;
            color: #64748b;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .segmented-tab.active {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        .segmented-tab.active-blue {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* Bed Cards */
        .bed-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.05);
            position: relative;
            overflow: hidden;
        }

        .bed-card:hover, .bed-card:active {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.12);
            border-color: #cbd5e1;
        }

        .bed-status-available { border-top: 5px solid #16a34a; }
        .bed-status-occupied { border-top: 5px solid #2563eb; }
        .bed-status-cleaning { border-top: 5px solid #d97706; }
        .bed-status-maintenance { border-top: 5px solid #dc2626; }

        .mobile-patient-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.05);
            border-left: 6px solid var(--accent-blue);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Status Pills */
        .status-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-pill.waiting { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .status-pill.visited { background-color: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; }
        .status-pill.booked { background-color: #f8fafc; color: #475569; border: 1px solid #cbd5e1; }

        .queue-badge {
            background: #0f172a;
            color: #ffffff;
            font-weight: 800;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
        }

        /* Lock Screen Overlay */
        .lock-screen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lock-card {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Fluid I/O Stats Cards */
        .stat-card-intake {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 1.5px solid #a7f3d0;
            border-radius: 14px;
            padding: 10px 8px;
        }
        .stat-card-output {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1.5px solid #fde68a;
            border-radius: 14px;
            padding: 10px 8px;
        }
        .stat-card-balance {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1.5px solid #bfdbfe;
            border-radius: 14px;
            padding: 10px 8px;
        }

        /* Floating Bottom Dock Action Bar */
        .bottom-dock-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1040;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -6px 25px rgba(15, 23, 42, 0.1);
            padding: 8px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .bottom-dock-btn {
            border: none;
            border-radius: 14px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            color: #ffffff;
            text-decoration: none;
            flex: 1;
            cursor: pointer;
        }

        .bottom-dock-btn:active {
            transform: scale(0.95);
        }

        .bottom-dock-btn.btn-scan {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
        }

        .bottom-dock-btn.btn-vitals {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }

        .bottom-dock-btn.btn-doc {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .content-with-bottom-dock {
            padding-bottom: 96px !important;
        }

        .qr-scanner-wrapper {
            position: relative;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #3b82f6;
            min-height: 240px;
        }

        .patient-search-result-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .patient-search-result-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 4px 14px rgba(37,99,235,0.08);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="/App/Nursing/nursing-app.bundle.js"></script>
</body>
</html>
