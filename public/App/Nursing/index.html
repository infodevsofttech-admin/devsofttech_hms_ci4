<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nursing Care - HMS Mobile</title>
    <link rel="manifest" href="/App/Nursing/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/assets/img/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/img/logo.png">
    
    <!-- Google Fonts & Bootstrap 5 CSS & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- React 18 & ReactDOM UMD -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- Cropper.js for Document Photo Cropping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <!-- HTML5 QR & Barcode Scanner for Patient Barcodes and ABHA QR -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        :root {
            --primary-bg: #0f172a;
            --card-bg: #ffffff;
            --accent-blue: #2563eb;
            --accent-cyan: #0891b2;
            --accent-green: #16a34a;
            --accent-amber: #d97706;
            --accent-red: #dc2626;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            color: #334155;
        }

        /* Android TV D-Pad Remote Focus Glow Outline */
        :focus-visible, button:focus, select:focus, input:focus, .card:focus, a:focus {
            outline: 3px solid #2563eb !important;
            outline-offset: 2px !important;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.6) !important;
        }

        /* Topbar Header */
        .nursing-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 12px 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.25);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .avatar-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }

        .patient-avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #eff6ff;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            border: 1.5px solid #dbeafe;
            flex-shrink: 0;
        }

        /* Segmented Tabs */
        .segmented-tabs {
            background: #e2e8f0;
            border-radius: 12px;
            padding: 4px;
            display: flex;
            gap: 4px;
        }

        .segmented-tab {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 14px;
            border-radius: 9px;
            font-weight: 600;
            font-size: 13px;
            color: #64748b;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .segmented-tab.active {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
        }

        .segmented-tab.active-blue {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        /* Bed Cards */
        .bed-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.05);
            position: relative;
            overflow: hidden;
        }

        .bed-card:hover, .bed-card:active {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.12);
            border-color: #cbd5e1;
        }

        .bed-status-available { border-top: 5px solid #16a34a; }
        .bed-status-occupied { border-top: 5px solid #2563eb; }
        .bed-status-cleaning { border-top: 5px solid #d97706; }
        .bed-status-maintenance { border-top: 5px solid #dc2626; }

        .mobile-patient-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.05);
            border-left: 6px solid var(--accent-blue);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Status Pills */
        .status-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-pill.waiting { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .status-pill.visited { background-color: #ecfeff; color: #0e7490; border: 1px solid #a5f3fc; }
        .status-pill.booked { background-color: #f8fafc; color: #475569; border: 1px solid #cbd5e1; }

        .queue-badge {
            background: #0f172a;
            color: #ffffff;
            font-weight: 800;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
        }

        /* Lock Screen Overlay */
        .lock-screen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .lock-card {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Fluid I/O Stats Cards */
        .stat-card-intake {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            border: 1.5px solid #a7f3d0;
            border-radius: 14px;
            padding: 10px 8px;
        }
        .stat-card-output {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1.5px solid #fde68a;
            border-radius: 14px;
            padding: 10px 8px;
        }
        .stat-card-balance {
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            border: 1.5px solid #bfdbfe;
            border-radius: 14px;
            padding: 10px 8px;
        }

        /* Floating Bottom Dock Action Bar */
        .bottom-dock-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1040;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -6px 25px rgba(15, 23, 42, 0.1);
            padding: 8px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        .bottom-dock-btn {
            border: none;
            border-radius: 14px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            color: #ffffff;
            text-decoration: none;
            flex: 1;
            cursor: pointer;
        }

        .bottom-dock-btn:active {
            transform: scale(0.95);
        }

        .bottom-dock-btn.btn-scan {
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%);
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
        }

        .bottom-dock-btn.btn-vitals {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }

        .bottom-dock-btn.btn-doc {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .content-with-bottom-dock {
            padding-bottom: 96px !important;
        }

        .qr-scanner-wrapper {
            position: relative;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #3b82f6;
            min-height: 240px;
        }

        .patient-search-result-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .patient-search-result-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 4px 14px rgba(37,99,235,0.08);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DEVICE_AUTH_KEY = 'nursing_pwa_device_auth_v1';
        const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

        const MobileAppsModal = ({ show, onClose, currentApp }) => {
            if (!show) return null;

            const navigateToApp = (appKey) => {
                if (appKey === currentApp) {
                    onClose();
                    return;
                }
                if (appKey === 'doctor') {
                    window.location.href = '/app/doctor';
                } else if (appKey === 'nursing') {
                    window.location.href = '/app/nursing';
                }
            };

            return (
                <div className="modal fade show d-block" style={{ backgroundColor: 'rgba(15, 23, 42, 0.7)', zIndex: 1055, backdropFilter: 'blur(4px)' }} tabIndex="-1">
                    <div className="modal-dialog modal-dialog-centered px-2">
                        <div className="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                            <div className="modal-header text-white p-3" style={{ background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)' }}>
                                <div className="d-flex align-items-center gap-2">
                                    <img src="/assets/img/logo.png" alt="Hospital Logo" style={{ height: '28px', width: 'auto', filter: 'brightness(0) invert(1)' }} onError={(e) => { e.target.style.display = 'none'; }} />
                                    <h6 className="modal-title fw-bold mb-0 text-white" style={{ fontSize: '15px' }}>
                                        <i className="bi bi-grid-fill me-1 text-primary"></i> HMS Mobile &amp; PWA Apps Launcher
                                    </h6>
                                </div>
                                <button type="button" className="btn-close btn-close-white" onClick={onClose}></button>
                            </div>
                            <div className="modal-body p-3 bg-light">
                                <label className="form-label fw-bold small text-secondary mb-2" style={{ letterSpacing: '0.5px' }}>
                                    1. SELECT APPLICATION
                                </label>
                                <div className="row g-2 mb-3">
                                    <div className="col-4">
                                        <div 
                                            className={`card p-2 text-center h-100 ${currentApp === 'nursing' ? 'border-2 border-primary bg-primary-subtle shadow-sm' : 'border bg-white text-dark'}`}
                                            style={{ cursor: 'pointer', borderRadius: '12px' }}
                                            onClick={() => navigateToApp('nursing')}
                                        >
                                            <div className="my-1">
                                                <i className="bi bi-heart-pulse-fill fs-3 text-primary"></i>
                                            </div>
                                            <div className="fw-bold small text-truncate" style={{ fontSize: '12px' }}>Nursing Care</div>
                                            {currentApp === 'nursing' ? (
                                                <span className="badge bg-primary mt-1" style={{ fontSize: '9px' }}>● Active App</span>
                                            ) : (
                                                <span className="badge bg-info-subtle text-info-emphasis border border-info-subtle mt-1" style={{ fontSize: '9px' }}>Active PWA</span>
                                            )}
                                        </div>
                                    </div>

                                    <div className="col-4">
                                        <div 
                                            className={`card p-2 text-center h-100 ${currentApp === 'doctor' ? 'border-2 border-primary bg-primary-subtle shadow-sm' : 'border bg-white text-dark'}`}
                                            style={{ cursor: 'pointer', borderRadius: '12px' }}
                                            onClick={() => navigateToApp('doctor')}
                                        >
                                            <div className="my-1">
                                                <i className="bi bi-person-badge-fill fs-3 text-primary"></i>
                                            </div>
                                            <div className="fw-bold small text-truncate" style={{ fontSize: '12px' }}>Doctor App</div>
                                            {currentApp === 'doctor' ? (
                                                <span className="badge bg-primary mt-1" style={{ fontSize: '9px' }}>● Active App</span>
                                            ) : (
                                                <span className="badge bg-success mt-1" style={{ fontSize: '9px' }}>Active PWA</span>
                                            )}
                                        </div>
                                    </div>

                                    <div className="col-4">
                                        <div 
                                            className="card p-2 text-center border bg-white text-muted opacity-75 h-100"
                                            style={{ borderRadius: '12px', cursor: 'not-allowed' }}
                                        >
                                            <div className="my-1">
                                                <i className="bi bi-capsule fs-3 text-secondary"></i>
                                            </div>
                                            <div className="fw-bold small text-truncate" style={{ fontSize: '12px' }}>Pharmacy App</div>
                                            <span className="badge bg-secondary mt-1" style={{ fontSize: '9px' }}>Coming Soon</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-3 bg-white rounded-3 border text-center shadow-sm">
                                    <div className="d-flex align-items-center justify-content-center gap-2 mb-2">
                                        <img src="/assets/img/logo.png" alt="Logo" style={{ height: '28px' }} onError={(e) => e.target.style.display = 'none'} />
                                        <div className="text-start">
                                            <div className="fw-bold small text-dark">HMS Unified Mobile Portal</div>
                                            <div className="small text-muted" style={{ fontSize: '10px' }}>Domain: {window.location.host}</div>
                                        </div>
                                    </div>
                                    <p className="small text-muted mb-2" style={{ fontSize: '11px' }}>
                                        Tap any active app card above to switch between modules in your mobile app.
                                    </p>
                                    <a href="/app" className="btn btn-outline-primary btn-sm w-100 fw-bold rounded-pill" style={{ fontSize: '12px' }}>
                                        <i className="bi bi-house-door me-1"></i> Open Mobile App Hub
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function NursingApp() {
            const [showAppsModal, setShowAppsModal] = useState(false);
            const [mainTab, setMainTab] = useState('ipd'); // 'ipd' or 'opd'
            const [beds, setBeds] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedWard, setSelectedWard] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [activeBed, setActiveBed] = useState(null);
            const [activeTab, setActiveTab] = useState('vitals');
            const [workspaceData, setWorkspaceData] = useState([]);
            const [nurses, setNurses] = useState([]);

            // OPD Patients State
            const [opdAppointments, setOpdAppointments] = useState([]);
            const [opdCounts, setOpdCounts] = useState({ all: 0, waiting: 0, visited: 0, booked: 0, cancelled: 0, pending_vitals: 0, done_vitals: 0 });
            const [opdFilter, setOpdFilter] = useState('all');
            const [opdDateMode, setOpdDateMode] = useState('today');
            const [doctors, setDoctors] = useState([]);
            const [selectedDoctorId, setSelectedDoctorId] = useState('0');
            const [vitalsFilter, setVitalsFilter] = useState('all'); // 'all', 'pending', 'done'

            // Modals & Action State
            const [activeOpdForVitals, setActiveOpdForVitals] = useState(null);
            const [opdVitalsForm, setOpdVitalsForm] = useState({
                temp: '', pulse: '', bp_systolic: '', bp_diastolic: '', spo2: '', weight: '', height: '', rr_min: ''
            });

            const [scanTarget, setScanTarget] = useState(null); // OPD or IPD object
            const [scanType, setScanType] = useState('opd'); // 'opd' or 'ipd'
            const [scanDocCategory, setScanDocCategory] = useState('Paper Document');
            const [scanImageBase64, setScanImageBase64] = useState('');
            const [scanImagePreview, setScanImagePreview] = useState('');

            // ABDM M2 & Patient Search / Barcode Scanner State
            const [showPatientSearchModal, setShowPatientSearchModal] = useState(false);
            const [searchModalTab, setSearchModalTab] = useState('scan'); // 'scan' or 'type'
            const [patientSearchQuery, setPatientSearchQuery] = useState('');
            const [patientSearchResults, setPatientSearchResults] = useState([]);
            const [searchingPatient, setSearchingPatient] = useState(false);
            const [scannerActive, setScannerActive] = useState(false);
            const [scannerError, setScannerError] = useState('');

            // ABDM M2 Wellness Vitals Modal State
            const [activeWellnessPatient, setActiveWellnessPatient] = useState(null);
            const [wellnessForm, setWellnessForm] = useState({
                temperature_f: '', pulse_rate: '', resp_rate: '',
                bp_systolic: '', bp_diastolic: '', spo2: '', weight_kg: '', height_cm: '',
                general_advice: '', diet_lifestyle_note: ''
            });

            // ABDM M2 Health Document Modal State
            const [activeDocPatient, setActiveDocPatient] = useState(null);
            const [patientDocForm, setPatientDocForm] = useState({
                document_type: 'Health Document',
                document_date: new Date().toISOString().slice(0, 10),
                remarks: ''
            });

            // Vitals History Modal State
            const [wellnessHistoryPatient, setWellnessHistoryPatient] = useState(null);
            const [wellnessHistoryList, setWellnessHistoryList] = useState([]);
            const [loadingHistory, setLoadingHistory] = useState(false);

            // Auth State
            const [authenticatedNurse, setAuthenticatedNurse] = useState(null);
            const [authNurseId, setAuthNurseId] = useState(0);
            const [pinInput, setPinInput] = useState('');
            const [pinError, setPinError] = useState('');
            const [isSettingNewPin, setIsSettingNewPin] = useState(false);
            const [newPin, setNewPin] = useState('');
            const [confirmPin, setConfirmPin] = useState('');

            // Workspace Forms (IPD)
            const [vitalsForm, setVitalsForm] = useState({
                temperature_f: '', pulse_rate: '', resp_rate: '',
                bp_systolic: '', bp_diastolic: '', spo2: '', weight_kg: '', general_note: ''
            });

            const [fluidForm, setFluidForm] = useState({
                fluid_direction: 'intake', fluid_route: 'IV (Intravenous)',
                fluid_amount_ml: '', general_note: ''
            });

            const [treatmentForm, setTreatmentForm] = useState({
                treatment_text: '', general_note: ''
            });

            const [showAllDoctorOrders, setShowAllDoctorOrders] = useState(false);

            const fetchBeds = async () => {
                try {
                    setLoading(true);
                    const res = await fetch('/api/v1/nursing/beds');
                    const json = await res.json();
                    if (json.status === 1 && json.data) {
                        setBeds(json.data.beds || []);
                    }
                } catch (err) {
                    console.error('Failed to load beds', err);
                } finally {
                    setLoading(false);
                }
            };

            const fetchDoctors = async () => {
                try {
                    const res = await fetch('/api/v1/doctor/list');
                    const json = await res.json();
                    if (json.status === 1 && json.data) {
                        setDoctors(json.data);
                    }
                } catch (err) {
                    console.error('Failed to load doctors', err);
                }
            };

            const fetchOpdAppointments = async (dateModeOverride, docIdOverride, vitalsOverride) => {
                try {
                    const mode = dateModeOverride !== undefined ? dateModeOverride : opdDateMode;
                    const docId = docIdOverride !== undefined ? docIdOverride : selectedDoctorId;
                    const vFilter = vitalsOverride !== undefined ? vitalsOverride : vitalsFilter;

                    const res = await fetch(`/api/v1/nursing/opd/list?date_mode=${mode}&doctor_id=${docId}&vitals_status=${vFilter}`);
                    const json = await res.json();
                    if (json.status === 1) {
                        setOpdAppointments(json.appointments || []);
                        if (json.counts) {
                            setOpdCounts(json.counts);
                        }
                    }
                } catch (err) {
                    console.error('Failed to load OPD appointments', err);
                }
            };

            const fetchNurses = async () => {
                try {
                    const res = await fetch('/api/v1/nursing/nurses');
                    const json = await res.json();
                    if (json.status === 1 && json.data) {
                        setNurses(json.data);

                        const params = new URLSearchParams(window.location.search);
                        const codeParam = params.get('nurse_code');
                        if (codeParam) {
                            const matched = json.data.find(n => n.nurse_code === codeParam);
                            if (matched) {
                                setAuthNurseId(matched.id);
                            }
                        }
                    }
                } catch (err) {
                    console.error('Failed to load nurses', err);
                }
            };

            useEffect(() => {
                const savedAuth = localStorage.getItem(DEVICE_AUTH_KEY);
                if (savedAuth) {
                    try {
                        const parsed = JSON.parse(savedAuth);
                        if (parsed && parsed.nurse && parsed.expires_at > Date.now()) {
                            setAuthenticatedNurse(parsed.nurse);
                        } else {
                            localStorage.removeItem(DEVICE_AUTH_KEY);
                        }
                    } catch (e) {}
                }
                fetchBeds();
                fetchNurses();
                fetchDoctors();
                fetchOpdAppointments('today', '0', 'all');
            }, []);

            const handleVerifyPin = async () => {
                if (!authNurseId || authNurseId === '0') {
                    setPinError('Please select your Nursing Staff Profile.');
                    return;
                }
                if (!pinInput || pinInput.length < 4) {
                    setPinError('Enter your 4 to 6 digit Security PIN.');
                    return;
                }

                setPinError('');
                try {
                    const body = new URLSearchParams();
                    body.append('nurse_id', authNurseId);
                    body.append('pin', pinInput);

                    const res = await fetch('/api/v1/nursing/auth/verify-pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body.toString()
                    });
                    const json = await res.json();

                    if (json.status === 1 && json.nurse) {
                        setAuthenticatedNurse(json.nurse);
                        const deviceAuthObj = {
                            nurse: json.nurse,
                            expires_at: Date.now() + THIRTY_DAYS_MS
                        };
                        localStorage.setItem(DEVICE_AUTH_KEY, JSON.stringify(deviceAuthObj));
                        setPinInput('');
                        fetchBeds();
                        fetchOpdAppointments(opdDateMode, selectedDoctorId, vitalsFilter);
                    } else if (json.status === 2) {
                        setIsSettingNewPin(true);
                    } else {
                        setPinError(json.message || 'Incorrect Security PIN');
                    }
                } catch (err) {
                    setPinError('Connection error verifying PIN.');
                }
            };

            const handleSaveNewPin = async () => {
                if (!newPin || newPin.length < 4) {
                    setPinError('PIN must be 4 to 6 numeric digits.');
                    return;
                }
                if (newPin !== confirmPin) {
                    setPinError('New PIN and Confirm PIN do not match.');
                    return;
                }

                try {
                    const body = new URLSearchParams();
                    body.append('nurse_id', authNurseId || (authenticatedNurse ? authenticatedNurse.id : 0));
                    body.append('new_pin', newPin);

                    const res = await fetch('/api/v1/nursing/auth/set-pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body.toString()
                    });
                    const json = await res.json();

                    if (json.status === 1) {
                        alert('Security PIN set successfully! Enter your PIN to unlock.');
                        setIsSettingNewPin(false);
                        setNewPin('');
                        setConfirmPin('');
                        setPinInput('');
                    } else {
                        setPinError(json.message || 'Failed to update PIN');
                    }
                } catch (err) {
                    setPinError('Error setting PIN.');
                }
            };

            const handleLogout = () => {
                setAuthenticatedNurse(null);
                localStorage.removeItem(DEVICE_AUTH_KEY);
                setPinInput('');
                setActiveBed(null);
            };

            const openWorkspace = async (bed) => {
                if (!bed.ipd_id || bed.status !== 'occupied') return;
                setActiveBed(bed);
                try {
                    const res = await fetch(`/api/v1/nursing/workspace/${bed.ipd_id}`);
                    const json = await res.json();
                    if (json.status === 1) {
                        setWorkspaceData(json.entries || []);
                    }
                } catch (err) {
                    console.error('Failed to load workspace', err);
                }
            };

            const handleSaveIpdEntry = async (entryType, formData) => {
                if (!activeBed || !activeBed.ipd_id) return;

                try {
                    const payload = {
                        entry_type: entryType,
                        recorded_by: authenticatedNurse ? authenticatedNurse.name : 'Staff Nurse',
                        recorded_by_id: authenticatedNurse ? authenticatedNurse.id : 0,
                        ...formData
                    };

                    const res = await fetch(`/api/v1/nursing/entry/save/${activeBed.ipd_id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.status === 1) {
                        alert(json.message || 'Saved successfully!');
                        if (entryType === 'vitals') {
                            setVitalsForm({
                                temperature_f: '', pulse_rate: '', resp_rate: '',
                                bp_systolic: '', bp_diastolic: '', spo2: '', weight_kg: '', general_note: ''
                            });
                        } else if (entryType === 'fluid') {
                            setFluidForm({
                                fluid_direction: 'intake', fluid_route: 'IV (Intravenous)',
                                fluid_amount_ml: '', general_note: ''
                            });
                        } else if (entryType === 'treatment') {
                            setTreatmentForm({
                                treatment_text: '', general_note: ''
                            });
                        }
                        openWorkspace(activeBed);
                    } else {
                        alert(json.message || 'Failed to save entry');
                    }
                } catch (err) {
                    alert('Error saving nursing entry');
                }
            };

            // Open OPD Vitals Modal
            const openOpdVitalsModal = (app) => {
                setActiveOpdForVitals(app);
                setOpdVitalsForm({
                    temp: app.temp || '',
                    pulse: app.pulse || '',
                    bp_systolic: app.bp || '',
                    bp_diastolic: app.diastolic || '',
                    spo2: app.spo2 || '',
                    weight: app.weight || '',
                    height: app.height || '',
                    rr_min: app.rr_min || ''
                });
            };

            const handleSaveOpdVitals = async () => {
                if (!activeOpdForVitals) return;

                try {
                    const payload = {
                        nurse_id: authenticatedNurse ? authenticatedNurse.id : 0,
                        nurse_name: authenticatedNurse ? authenticatedNurse.name : 'Nurse',
                        ...opdVitalsForm
                    };

                    const res = await fetch(`/api/v1/nursing/opd/vitals/save/${activeOpdForVitals.opd_id}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.status === 1) {
                        alert(json.message || 'OPD Patient Vitals saved successfully!');
                        setActiveOpdForVitals(null);
                        fetchOpdAppointments(opdDateMode);
                    } else {
                        alert(json.message || 'Failed to save vitals');
                    }
                } catch (err) {
                    alert('Error saving OPD Vitals');
                }
            };

            // Open Document Scan Modal (OPD / IPD)
            const openScanModal = (targetObj, targetType) => {
                setScanTarget(targetObj);
                setScanType(targetType);
                setScanDocCategory('Paper Document');
                setScanImageBase64('');
                setScanImagePreview('');
            };

            const [cropSrc, setCropSrc] = useState('');
            const [cropper, setCropper] = useState(null);
            const imageRef = React.useRef(null);

            const handleScanImageCapture = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    setCropSrc(event.target.result);
                };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            useEffect(() => {
                if (cropSrc && imageRef.current) {
                    if (cropper) {
                        cropper.destroy();
                    }
                    const newCropper = new Cropper(imageRef.current, {
                        viewMode: 1,
                        autoCropArea: 0.9,
                        responsive: true,
                        restore: false,
                        guides: true,
                        center: true,
                        highlight: true,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false,
                    });
                    setCropper(newCropper);
                }
            }, [cropSrc]);

            const applyCrop = () => {
                if (cropper) {
                    const croppedCanvas = cropper.getCroppedCanvas({
                        maxWidth: 1600,
                        maxHeight: 1600,
                        imageSmoothingEnabled: true,
                        imageSmoothingQuality: 'high',
                    });
                    if (croppedCanvas) {
                        const croppedBase64 = croppedCanvas.toDataURL('image/jpeg', 0.85);
                        setScanImageBase64(croppedBase64);
                        setScanImagePreview(croppedBase64);
                    }
                    cropper.destroy();
                    setCropper(null);
                    setCropSrc('');
                }
            };

            const cancelCrop = () => {
                if (cropper) {
                    cropper.destroy();
                    setCropper(null);
                }
                setCropSrc('');
            };

            const handleSaveScanDocument = async () => {
                if (!scanTarget || !scanImageBase64) {
                    alert('Please capture or select a document photo.');
                    return;
                }

                try {
                    const payload = {
                        nurse_id: authenticatedNurse ? authenticatedNurse.id : 0,
                        nurse_name: authenticatedNurse ? authenticatedNurse.name : 'Nurse',
                        document_type: scanDocCategory,
                        image_base64: scanImageBase64
                    };

                    const url = scanType === 'opd' 
                        ? `/api/v1/nursing/opd/scan/save/${scanTarget.opd_id}`
                        : `/api/v1/nursing/ipd/scan/save/${scanTarget.ipd_id || scanTarget.id}`;

                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.status === 1) {
                        alert(json.message || 'Scanned Document uploaded successfully!');
                        setScanTarget(null);
                        if (scanType === 'opd') fetchOpdAppointments(opdDateMode);
                        if (scanType === 'ipd' && activeBed) openWorkspace(activeBed);
                    } else {
                        alert(json.message || 'Failed to save document scan');
                    }
                } catch (err) {
                    alert('Error saving document scan');
                }
            };

            // -----------------------------------------------------------------
            // ABDM M2 PATIENT SEARCH & BARCODE / QR SCANNER HANDLERS
            // -----------------------------------------------------------------
            let scannerInstance = null;

            const startBarcodeQrScanner = () => {
                if (typeof Html5Qrcode === 'undefined') {
                    setScannerError('Scanner library is loading. Please try in a moment.');
                    return;
                }
                setScannerError('');
                setScannerActive(true);

                setTimeout(() => {
                    const readerElem = document.getElementById('patient-qr-reader');
                    if (!readerElem) return;

                    try {
                        if (scannerInstance) {
                            scannerInstance.stop().catch(() => {}).finally(() => {
                                initHtml5QrCode(readerElem);
                            });
                        } else {
                            initHtml5QrCode(readerElem);
                        }
                    } catch (e) {
                        setScannerError('Could not access camera: ' + (e.message || e));
                        setScannerActive(false);
                    }
                }, 300);
            };

            const initHtml5QrCode = (readerElem) => {
                try {
                    const html5QrCode = new Html5Qrcode("patient-qr-reader");
                    scannerInstance = html5QrCode;
                    const config = {
                        fps: 12,
                        qrbox: { width: 280, height: 180 },
                        aspectRatio: 1.333334,
                        formatsToSupport: [
                            Html5QrcodeSupportedFormats.QR_CODE,
                            Html5QrcodeSupportedFormats.CODE_128,
                            Html5QrcodeSupportedFormats.CODE_39,
                            Html5QrcodeSupportedFormats.EAN_13,
                            Html5QrcodeSupportedFormats.EAN_8,
                            Html5QrcodeSupportedFormats.DATA_MATRIX
                        ]
                    };

                    html5QrCode.start(
                        { facingMode: "environment" },
                        config,
                        (decodedText) => {
                            // On successful scan
                            stopBarcodeQrScanner();
                            setSearchModalTab('type');
                            setPatientSearchQuery(decodedText);
                            executePatientSearch(decodedText);
                        },
                        (errorMessage) => {
                            // ignore frame errors
                        }
                    ).catch(err => {
                        setScannerError('Camera permission required or camera busy: ' + (err.message || err));
                        setScannerActive(false);
                    });
                } catch (err) {
                    setScannerError('Failed to initialize camera scanner: ' + (err.message || err));
                    setScannerActive(false);
                }
            };

            const stopBarcodeQrScanner = () => {
                if (scannerInstance) {
                    try {
                        scannerInstance.stop().then(() => {
                            scannerInstance.clear();
                            scannerInstance = null;
                            setScannerActive(false);
                        }).catch(() => {
                            scannerInstance = null;
                            setScannerActive(false);
                        });
                    } catch (e) {
                        scannerInstance = null;
                        setScannerActive(false);
                    }
                } else {
                    setScannerActive(false);
                }
            };

            const openPatientSearch = (defaultTab = 'scan') => {
                setShowPatientSearchModal(true);
                setSearchModalTab(defaultTab);
                setPatientSearchResults([]);
                setPatientSearchQuery('');
                if (defaultTab === 'scan') {
                    startBarcodeQrScanner();
                } else {
                    stopBarcodeQrScanner();
                }
            };

            const closePatientSearch = () => {
                stopBarcodeQrScanner();
                setShowPatientSearchModal(false);
                setPatientSearchResults([]);
                setPatientSearchQuery('');
            };

            const executePatientSearch = async (queryText) => {
                const q = queryText !== undefined ? queryText : patientSearchQuery;
                if (!q || q.trim() === '') {
                    setPatientSearchResults([]);
                    return;
                }
                setSearchingPatient(true);
                try {
                    const res = await fetch(`/api/v1/nursing/patient/search?q=${encodeURIComponent(q.trim())}`);
                    const json = await res.json();
                    if (json.status === 1) {
                        setPatientSearchResults(json.data || []);
                    } else {
                        setPatientSearchResults([]);
                    }
                } catch (err) {
                    console.error('Patient search error', err);
                } finally {
                    setSearchingPatient(false);
                }
            };

            // ABDM M2 Wellness Actions
            const openWellnessModal = (patient) => {
                setActiveWellnessPatient(patient);
                const opdVitals = patient.opd_today || {};
                setWellnessForm({
                    temperature_f: opdVitals.temp || '',
                    pulse_rate: opdVitals.pulse || '',
                    resp_rate: opdVitals.rr_min || '',
                    bp_systolic: opdVitals.bp || '',
                    bp_diastolic: opdVitals.diastolic || '',
                    spo2: opdVitals.spo2 || '',
                    weight_kg: opdVitals.weight || '',
                    height_cm: opdVitals.height || '',
                    general_advice: '',
                    diet_lifestyle_note: ''
                });
                setShowPatientSearchModal(false);
                stopBarcodeQrScanner();
            };

            const handleSaveWellness = async () => {
                if (!activeWellnessPatient) return;
                try {
                    const payload = {
                        patient_id: activeWellnessPatient.id,
                        recorded_by: authenticatedNurse ? authenticatedNurse.name : 'Staff Nurse',
                        recorded_by_id: authenticatedNurse ? authenticatedNurse.id : 0,
                        ...wellnessForm
                    };
                    const res = await fetch('/api/v1/nursing/patient/wellness/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.status === 1) {
                        alert('✅ ' + (json.message || 'ABDM M2 Wellness Vitals saved successfully!') + (json.bmi ? ` (BMI: ${json.bmi})` : ''));
                        setActiveWellnessPatient(null);
                        setWellnessForm({
                            temperature_f: '', pulse_rate: '', resp_rate: '',
                            bp_systolic: '', bp_diastolic: '', spo2: '', weight_kg: '', height_cm: '',
                            general_advice: '', diet_lifestyle_note: ''
                        });
                    } else {
                        alert(json.message || 'Failed to save wellness vitals');
                    }
                } catch (err) {
                    alert('Error saving wellness vitals');
                }
            };

            // ABDM M2 Health Document Actions
            const openDocModal = (patient) => {
                setActiveDocPatient(patient);
                setScanImageBase64('');
                setScanImagePreview('');
                setPatientDocForm({
                    document_type: 'Health Document',
                    document_date: new Date().toISOString().slice(0, 10),
                    remarks: ''
                });
                setShowPatientSearchModal(false);
                stopBarcodeQrScanner();
            };

            const handleSavePatientDocument = async () => {
                if (!activeDocPatient) return;
                if (!scanImageBase64) {
                    alert('Please capture or upload a document photo first.');
                    return;
                }
                try {
                    const payload = {
                        patient_id: activeDocPatient.id,
                        nurse_name: authenticatedNurse ? authenticatedNurse.name : 'Staff Nurse',
                        nurse_id: authenticatedNurse ? authenticatedNurse.id : 0,
                        image_base64: scanImageBase64,
                        ...patientDocForm
                    };
                    const res = await fetch('/api/v1/nursing/patient/document/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const json = await res.json();
                    if (json.status === 1) {
                        alert('✅ ' + (json.message || 'ABDM M2 Health Document uploaded successfully!'));
                        setActiveDocPatient(null);
                        setScanImageBase64('');
                        setScanImagePreview('');
                    } else {
                        alert(json.message || 'Failed to upload health document');
                    }
                } catch (err) {
                    alert('Error uploading health document');
                }
            };

            // Vitals History Actions
            const openWellnessHistory = async (patient) => {
                setWellnessHistoryPatient(patient);
                setLoadingHistory(true);
                try {
                    const res = await fetch(`/api/v1/nursing/patient/wellness/history/${patient.id}`);
                    const json = await res.json();
                    if (json.status === 1) {
                        setWellnessHistoryList(json.records || []);
                    }
                } catch (err) {
                    console.error('Failed to load history', err);
                } finally {
                    setLoadingHistory(false);
                }
            };

            const getInitials = (nameStr) => {
                if (!nameStr) return 'N';
                const parts = nameStr.trim().split(' ');
                if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
                return nameStr.substring(0, 2).toUpperCase();
            };

            const renderNoteContent = (entry) => {
                const text = entry.treatment_text || entry.general_note || '';
                const match = text.match(/\[IMAGE_ATTACHMENT:(.*?)\]/);
                const cleanText = text.replace(/\[IMAGE_ATTACHMENT:.*?\]/, '').replace('[Doctor Note] ', '');

                return (
                    <div>
                        {cleanText && <div className="small fw-semibold">{cleanText}</div>}
                        {match && match[1] && (
                            <div className="mt-2">
                                <span className="badge bg-primary mb-1 d-inline-flex align-items-center gap-1" style={{fontSize: '10px'}}>
                                    <i className="bi bi-paperclip"></i> Attached Document / Photo
                                </span>
                                <a href={match[1]} target="_blank" rel="noreferrer">
                                    <img src={match[1]} alt="Attached Document" className="img-fluid rounded-3 border shadow-sm d-block mt-1" style={{maxHeight: '220px', objectFit: 'cover'}} />
                                </a>
                            </div>
                        )}
                    </div>
                );
            };

            const displayTempF = (tempC) => {
                if (tempC === null || tempC === undefined || tempC === '') return '-';
                const val = (parseFloat(tempC) * 9 / 5) + 32;
                return val.toFixed(1) + '°F';
            };

            const formatDateTime = (dtStr) => {
                if (!dtStr) return '-';
                try {
                    const d = new Date(dtStr.replace(/-/g, '/'));
                    if (isNaN(d.getTime())) return dtStr;
                    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                } catch (e) {
                    return dtStr;
                }
            };

            // Filtered lists: Only Admitted IPD Patients with Bed (Occupied Beds)
            const filteredBeds = beds.filter(bed => {
                const isOccupied = bed.status === 'occupied' || (bed.patient_name && bed.patient_name.trim() !== '') || Boolean(bed.ipd_id);
                const matchesWard = selectedWard === 'all' || bed.ward_name === selectedWard;
                const q = searchQuery.toLowerCase();
                const matchesSearch = searchQuery === '' || 
                    (bed.bed_number || '').toLowerCase().includes(q) ||
                    (bed.patient_name || '').toLowerCase().includes(q) ||
                    (bed.uhid || '').toLowerCase().includes(q) ||
                    (bed.ipd_code || '').toLowerCase().includes(q) ||
                    (bed.doctor_name || '').toLowerCase().includes(q);
                return isOccupied && matchesWard && matchesSearch;
            });

            const filteredOpdAppointments = opdAppointments.filter(app => {
                const matchesFilter = opdFilter === 'all' || app.status_key === opdFilter;
                const q = searchQuery.toLowerCase();
                const name = (app.patient_display_name || '').toLowerCase();
                const uhid = (app.uhid || '').toLowerCase();
                const opdCode = (app.opd_code || '').toLowerCase();
                const docName = (app.doctor_name || '').toLowerCase();
                return matchesFilter && (searchQuery === '' || name.includes(q) || uhid.includes(q) || opdCode.includes(q) || docName.includes(q));
            });

            // -------------------------------------------------------------
            // LOCK SCREEN
            // -------------------------------------------------------------
            if (!authenticatedNurse) {
                return (
                    <div className="lock-screen-overlay">
                        <MobileAppsModal show={showAppsModal} onClose={() => setShowAppsModal(false)} currentApp="nursing" />
                        <div className="lock-card">
                            <div className="p-4 text-center text-white position-relative" style={{background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 100%)'}}>
                                <button 
                                    type="button" 
                                    className="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-2 rounded-circle" 
                                    style={{width: '32px', height: '32px', padding: 0}}
                                    onClick={() => setShowAppsModal(true)}
                                    title="HMS Mobile & PWA Apps Launcher"
                                >
                                    <i className="bi bi-grid-3x3-gap-fill" style={{fontSize: '12px'}}></i>
                                </button>
                                <img src="/assets/img/logo.png" alt="Hospital Logo" className="d-block mx-auto mb-2" style={{maxHeight: '40px', filter: 'brightness(0) invert(1)'}} onError={(e) => { e.target.style.display = 'none'; }} />
                                <h5 className="fw-bold mb-1">Nursing Care Mobile App</h5>
                                <small className="opacity-75">30-Day Device Security Authentication</small>
                            </div>

                            <div className="p-4">
                                {pinError && <div className="alert alert-danger py-2 px-3 small mb-3">{pinError}</div>}

                                {!isSettingNewPin ? (
                                    <div>
                                        <div className="mb-3">
                                            <label className="form-label fw-bold small">Select Nursing Staff Profile</label>
                                            <select 
                                                className="form-select form-select-lg fs-6"
                                                value={authNurseId}
                                                onChange={(e) => setAuthNurseId(e.target.value)}
                                            >
                                                <option value="0">-- Choose Nurse Profile --</option>
                                                {nurses.map(n => (
                                                    <option key={n.id} value={n.id}>[{n.nurse_code}] {n.name}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="mb-4">
                                            <label className="form-label fw-bold small">Enter App Security PIN</label>
                                            <input 
                                                type="password" 
                                                maxLength="6"
                                                className="form-control text-center fs-3"
                                                placeholder="••••"
                                                value={pinInput}
                                                onChange={(e) => setPinInput(e.target.value)}
                                                onKeyUp={(e) => e.key === 'Enter' && handleVerifyPin()}
                                            />
                                            <small className="text-muted text-center d-block mt-1" style={{fontSize: '11px'}}>
                                                Unlocks device access for 30 days
                                            </small>
                                        </div>

                                        <button className="btn btn-success btn-lg w-100 py-3 fw-bold shadow-sm" onClick={handleVerifyPin}>
                                            <i className="bi bi-unlock-fill me-2"></i> Unlock Nursing App
                                        </button>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="alert alert-info py-2 small mb-3">
                                            Initial PIN Setup for Nurse Profile. Set a 4-6 digit Security PIN.
                                        </div>
                                        <div className="mb-3">
                                            <label className="form-label fw-bold small">New Security PIN</label>
                                            <input 
                                                type="password" 
                                                maxLength="6"
                                                className="form-control text-center fs-3"
                                                placeholder="••••"
                                                value={newPin}
                                                onChange={(e) => setNewPin(e.target.value)}
                                            />
                                        </div>
                                        <div className="mb-3">
                                            <label className="form-label fw-bold small">Confirm New PIN</label>
                                            <input 
                                                type="password" 
                                                maxLength="6"
                                                className="form-control text-center fs-3"
                                                placeholder="••••"
                                                value={confirmPin}
                                                onChange={(e) => setConfirmPin(e.target.value)}
                                            />
                                        </div>
                                        <button className="btn btn-primary btn-lg w-100 py-3 fw-bold shadow-sm" onClick={handleSaveNewPin}>
                                            <i className="bi bi-check-circle-fill me-2"></i> Save PIN &amp; Unlock
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // -------------------------------------------------------------
            // UNLOCKED NURSING PWA APP
            // -------------------------------------------------------------
            return (
                <div>
                    <MobileAppsModal show={showAppsModal} onClose={() => setShowAppsModal(false)} currentApp="nursing" />
                    {/* Header Topbar */}
                    <header className="nursing-header d-flex justify-content-between align-items-center">
                        <div className="d-flex align-items-center gap-2">
                            <div className="avatar-circle">

                                                        <h5 className="fw-bold text-success mb-0">{totalIn.toLocaleString()} <span style={{fontSize: '11px'}}>ml</span></h5>

                                                            <i className="bi bi-arrow-down-left-circle me-1"></i> Fluid Intake (In)

                                                    </div>
                                                    <span className="badge bg-white text-dark small">{doctorOrders.length} Doctor Orders</span>
                                                </div>

                                                <div className="card-body p-3 bg-light">

                                                                <div className="mt-3">

                                                                                        <strong className="text-primary small">{docOrd.recorded_by}</strong>
                                                                                        <small className="text-muted" style={{fontSize: '11px'}}>{formatDateTime(docOrd.recorded_at)}</small>

                                                                                    {renderNoteContent(docOrd)}

                                                                            ))}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>

                                                            <i className="bi bi-clipboard-x fs-2 text-secondary opacity-50 d-block mb-1"></i>
                                                            <small>No doctor orders or clinical prescriptions recorded yet.</small>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="mb-3">
                                                    <label className="form-label small fw-bold mb-1">Treatment / Medication Administered <span className="text-danger">*</span></label>
                                                    <textarea 
                                                        className="form-control rounded-3" 
                                                        rows="3" 
                                                        placeholder="e.g. Inj. Ceftriaxone 1g IV given slowly, Tab Pantop 40mg given orally..." 
                                                        value={treatmentForm.treatment_text} 
                                                        onChange={e => setTreatmentForm({...treatmentForm, treatment_text: e.target.value})}
                                                    ></textarea>
                                                </div>

                                                <div className="mb-3">
                                                    <label className="form-label small fw-bold mb-1">Observation / Patient Response</label>
                                                    <input 
                                                        type="text" 
                                                        className="form-control form-control-sm" 
                                                        placeholder="e.g. Tolerated well, No adverse reaction, IV site patent" 
                                                        value={treatmentForm.general_note} 
                                                        onChange={e => setTreatmentForm({...treatmentForm, general_note: e.target.value})} 
                                                    />
                                                </div>

                                                <button 
                                                    className="btn btn-success fw-bold py-2 w-100 rounded-3 shadow-sm" 
                                                    onClick={() => {
                                                        if (!treatmentForm.treatment_text.trim()) {
                                                            alert('Please enter treatment or medication administered.');
                                                            return;
                                                        }
                                                        handleSaveIpdEntry('treatment', treatmentForm);
                                                    }}
                                                >
                                                    <i className="bi bi-send-check-fill me-1"></i> Log Treatment Administration
                                                </button>

                                                </div>

                                                                <th>Treatment / Medication Given</th>

                                                                        <td><small className="text-muted">{tr.general_note || '-'}</small></td>
                                                                        <td>
                                                                            <span className="badge bg-secondary-subtle text-secondary border">
                                                                                {tr.recorded_by || 'Staff Nurse'}

                                                                        </td>

                                    </div>
                                </div>
                            </div>
                        )}

                        {/* -------------------------------------------------------------
                           MODAL 4: PATIENT VITALS & WELLNESS HISTORY
                           ------------------------------------------------------------- */}
                        {wellnessHistoryPatient && (
                            <div className="modal show d-block" style={{backgroundColor: 'rgba(0,0,0,0.65)', zIndex: 1070}}>
                                <div className="modal-dialog modal-dialog-centered modal-lg">
                                    <div className="modal-content rounded-4 border-0 shadow-lg overflow-hidden">
                                        <div className="modal-header bg-dark text-white py-2.5">
                                            <div className="d-flex align-items-center gap-2">
                                                <i className="bi bi-clock-history fs-5 text-warning"></i>
                                                <div>
                                                    <h6 className="modal-title fw-bold mb-0">Vitals &amp; Wellness History</h6>
                                                    <small className="text-white-50" style={{fontSize: '11px'}}>
                                                        {wellnessHistoryPatient.fullName || wellnessHistoryPatient.p_fname} (UHID: {wellnessHistoryPatient.p_code || wellnessHistoryPatient.uhid})
                                                    </small>
                                                </div>
                                            </div>
                                            <button className="btn-close btn-close-white" onClick={() => setWellnessHistoryPatient(null)}></button>
                                        </div>

                                        <div className="modal-body p-3">
                                            {loadingHistory ? (
                                                <div className="text-center py-4">
                                                    <div className="spinner-border text-primary" role="status"></div>
                                                    <p className="small text-muted mt-2">Loading historical vitals...</p>
                                                </div>
                                            ) : wellnessHistoryList.length === 0 ? (
                                                <div className="text-center py-4 bg-light rounded-3">
                                                    <i className="bi bi-heart-pulse fs-2 text-muted opacity-50 d-block mb-1"></i>
                                                    <p className="small text-muted mb-0">No past vitals or wellness entries recorded yet for this patient.</p>
                                                </div>
                                            ) : (
                                                <div className="table-responsive">
                                                    <table className="table table-sm table-striped table-hover align-middle mb-0" style={{fontSize: '12px'}}>
                                                        <thead className="table-light">
                                                            <tr>
                                                                <th>Date &amp; Time</th>
                                                                <th>BP</th>
                                                                <th>Pulse</th>
                                                                <th>Temp</th>
                                                                <th>SpO2</th>
                                                                <th>BMI</th>
                                                                <th>Staff</th>
                                                                <th>Advice / Remarks</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {wellnessHistoryList.map(rec => (
                                                                <tr key={rec.id}>
                                                                    <td className="fw-semibold text-nowrap">{formatDateTime(rec.recorded_at)}</td>
                                                                    <td><span className="badge bg-light text-dark border">{rec.bp_systolic ? `${rec.bp_systolic}/${rec.bp_diastolic}` : '-'}</span></td>
                                                                    <td>{rec.pulse_rate ? `${rec.pulse_rate} bpm` : '-'}</td>
                                                                    <td><span className="badge bg-danger-subtle text-danger">{rec.temperature_f ? `${rec.temperature_f} °F` : '-'}</span></td>
                                                                    <td>{rec.spo2 ? `${rec.spo2}%` : '-'}</td>
                                                                    <td><span className="badge bg-info-subtle text-info">{rec.bmi || '-'}</span></td>
                                                                    <td><small className="text-muted">{rec.recorded_by || 'Staff'}</small></td>
                                                                    <td><small>{rec.general_advice || rec.diet_lifestyle_note || '-'}</small></td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>

                                        <div className="modal-footer p-2 bg-light">
                                            <button className="btn btn-secondary btn-sm px-3" onClick={() => setWellnessHistoryPatient(null)}>Close</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NursingApp />);
    </script>
</body>
</html>
